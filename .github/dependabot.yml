version: 2
updates:
  # Runtime and build dependencies. Grouped so a weekly refresh arrives as two PRs, not eight.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    ignore:
      # The installed Workers test runner requires Vitest 4; a Vitest 5 bump currently fails
      # `npm ci` with ERESOLVE. Remove this guard once the plugin supports Vitest 5.
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]

  # Workflow actions are pinned by commit SHA, so this is the only thing that moves them.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
