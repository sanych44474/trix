version: 2
updates:
  # Runtime and build dependencies. Grouped so a weekly refresh arrives as two PRs, not eight.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    ignore:
      # Vitest majors wait for @cloudflare/vitest-plugin to support them (a bump ahead of it fails
      # `npm ci` with ERESOLVE). Bump both together by hand.
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]

  # Workflow actions are pinned by commit SHA, so this is the only thing that moves them.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"

  # The Android app (mobile/): Kotlin, Compose, AGP and the libraries in gradle/libs.versions.toml.
  - package-ecosystem: gradle
    directory: /mobile
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      android:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps-android)"
