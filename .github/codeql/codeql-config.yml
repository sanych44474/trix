# CodeQL configuration (.github/workflows/codeql.yml).
#
# scripts/ holds operator command-line tools run by hand on a developer machine (seeding the
# catalog, pushing Grafana dashboards, checking AI provider keys, smoke tests). They never ship
# in the Worker or the Mini App. By design they read API keys from .dev.vars / wrangler.toml and
# send them to the matching provider, and cache API responses to local files, which is exactly
# what js/file-access-to-http and js/http-to-file-access flag. Everything that is deployed
# (src/, apps/) and the tests stay analysed with the full security-and-quality suite.
name: trix CodeQL config
queries:
  - uses: security-and-quality
paths-ignore:
  - scripts
