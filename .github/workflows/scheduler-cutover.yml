name: Scheduler cutover

# Flips one scheduler Durable-Object cutover flag, with the preconditions enforced instead of
# documented. The procedure and the reasoning live in docs/scheduler-do-cutover-runbook.md; this
# file is that runbook made executable, because the dangerous step in it is a precondition a
# human can skip by accident:
#
#   A DO only does work if its alarm was ever armed, and the cron arms them lazily -- only for
#   entities whose doWokenAt is NULL (scheduler.ts). Flipping `user` or `squad` while any entity
#   is still unwoken silently stops reminders for exactly those entities, with nothing failing
#   loudly to say so.
#
# So `enable` refuses to flip while the gate is non-zero. `check` runs the same gate and the
# dry-run parity report WITHOUT touching anything, which is how you decide. `disable` is the
# rollback and is deliberately ungated -- it must always be one click away.
#
# Runs under the `production` environment, so it inherits the same required-reviewer gate the
# deploy job uses. Approval authorises the attempt; the gate below is what protects the
# dangerous case.
on:
  workflow_dispatch:
    inputs:
      type:
        description: Which scheduler owns its jobs
        required: true
        type: choice
        options: [global, squad, user]
      action:
        description: check (read-only) | enable | disable (rollback)
        required: true
        default: check
        type: choice
        options: [check, enable, disable]

permissions:
  contents: read

# One flip at a time. Never cancel in progress: a half-applied cutover is worse than a queued one.
concurrency:
  group: scheduler-cutover
  cancel-in-progress: false

jobs:
  cutover:
    name: ${{ inputs.action }} ${{ inputs.type }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FLAG_TYPE: ${{ inputs.type }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node and install dependencies
        uses: ./.github/actions/node-deps

      - name: Current flag state
        run: |
          set -euo pipefail
          npx wrangler d1 execute trix --remote --command \
            "SELECT key, value FROM v2_settings WHERE key LIKE 'scheduler_cutover_%'"

      # The precondition. Global is exempt: scheduler.ts wakes its DO unconditionally every tick,
      # so there is nothing to drain. User and squad are woken lazily and can lag.
      - name: Wake gate
        if: inputs.action != 'disable' && inputs.type != 'global'
        run: |
          set -euo pipefail
          if [ "${FLAG_TYPE}" = "user" ]; then
            SQL="SELECT COUNT(*) AS unwoken FROM v2_accounts a
                   LEFT JOIN v2_onboarding o ON o.accountId = a.id
                  WHERE o.status = 'completed' AND a.doWokenAt IS NULL"
          else
            SQL="SELECT COUNT(*) AS unwoken FROM v2_squads WHERE doWokenAt IS NULL"
          fi
          npx wrangler d1 execute trix --remote --json --command "${SQL}" > gate.json
          UNWOKEN=$(node -e "
            const fs = require('node:fs');
            const raw = fs.readFileSync('gate.json', 'utf8');
            const parsed = JSON.parse(raw.slice(raw.indexOf('[')));
            process.stdout.write(String(parsed[0].results[0].unwoken));
          ")
          echo "unwoken ${FLAG_TYPE} entities: ${UNWOKEN}"
          if [ "${UNWOKEN}" != "0" ]; then
            echo "::error::${UNWOKEN} ${FLAG_TYPE} entities have never had their DO alarm armed. Cutting over now would silently stop their reminders. Let the cron drain them (it wakes a bounded batch per tick) and re-run."
            exit 1
          fi
          echo "::notice::wake gate clear for ${FLAG_TYPE}"

      # Advisory, not a gate: the comparison is count-based, so a human reads it. Run `check`
      # first, look at this output, then come back and run `enable`.
      - name: Dry-run parity report
        if: inputs.action != 'disable'
        continue-on-error: true
        run: node scripts/verify-scheduler-dryrun.mjs --type=${{ inputs.type }} --remote

      - name: Stop here (check only)
        if: inputs.action == 'check'
        run: echo "::notice::check complete — nothing was changed. Re-run with action=enable to flip."

      - name: Flip the flag
        if: inputs.action != 'check'
        env:
          FLAG_VALUE: ${{ inputs.action == 'enable' && '1' || '0' }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute trix --remote --command \
            "INSERT INTO v2_settings (key, value) VALUES ('scheduler_cutover_${FLAG_TYPE}', '${FLAG_VALUE}')
               ON CONFLICT(key) DO UPDATE SET value = excluded.value"
          echo "::notice::scheduler_cutover_${FLAG_TYPE} = ${FLAG_VALUE}"

      - name: Resulting flag state
        if: inputs.action != 'check'
        run: |
          set -euo pipefail
          npx wrangler d1 execute trix --remote --command \
            "SELECT key, value FROM v2_settings WHERE key LIKE 'scheduler_cutover_%'"
          echo "::notice::Watch the next few hourly ticks: do_alarm_run logs cutOver per alarm, and failures after cutover reach error_logs and the owner report. Rollback is this workflow with action=disable."
