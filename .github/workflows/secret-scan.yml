name: Secret scan

# Second line of defence behind GitHub's own push protection: catches credentials that reach a
# branch, including patterns GitHub has no partner rule for.
#
# This scans the checked-out tree rather than a commit range. Range scanning breaks whenever the
# base commit is no longer reachable (a force-push, a rebased branch) and then reports a tooling
# error instead of a clean result — useless behaviour for a security gate.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install gitleaks
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location "$url" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      - name: Scan working tree
        run: ./gitleaks dir . --redact --verbose --no-banner
