name: Deploy

# Deploys the Worker to Cloudflare. Triggers off CI (ci.yml) finishing on main, instead of running
# independently on push -- this is the ONLY way tests and deploy are separated: a commit whose CI
# run failed, was skipped, or hasn't finished never reaches the approval gate at all, and the
# gate itself no longer sits behind a second full typecheck/test/test:workers pass. The job
# targets the `production` environment, which has a required reviewer, so the deploy steps below
# still wait for an explicit human approval before anything live is touched -- approval now just
# comes faster once granted, since there's nothing left to re-run first.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A gated deploy sits in `waiting` until a reviewer approves it, so pushes during that window
# pile up behind it. Without cancellation the reviewer is offered the OLDEST queued commit while
# newer ones are stuck — the approval prompt then deploys superseded code. Cancelling supersedes
# the stale run so the pending approval always refers to the current tip of main.
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # workflow_run fires on EVERY completion of CI, success or failure -- only proceed past a
    # green run. workflow_dispatch (manual redeploy of the current main tip) has no associated
    # workflow_run event, so it isn't gated on this check.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: production
      url: ${{ vars.WORKER_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # workflow_run defaults to the workflow FILE's ref, not the commit CI actually tested --
          # pin explicitly to that commit. Falls back to the triggering ref for workflow_dispatch.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # wrangler.toml ships with placeholder identity so no deployment is baked into the source
      # tree. Values arrive as env vars (never interpolated straight into the script) and are
      # written in just before wrangler reads the file.
      - name: Inject deployment configuration
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          WORKER_URL: ${{ vars.WORKER_URL }}
          BOT_USERNAME: ${{ vars.BOT_USERNAME }}
          BOT_ID: ${{ vars.BOT_ID }}
          BOT_NAME: ${{ vars.BOT_NAME }}
        run: |
          set -euo pipefail
          if [ -z "${D1_DATABASE_ID}" ]; then
            echo "::error::D1_DATABASE_ID secret is not set for the production environment"
            exit 1
          fi
          if [ -z "${WORKER_URL}" ]; then
            echo "::error::WORKER_URL repository variable is not set"
            exit 1
          fi
          python3 - <<'PY'
          import os, re, pathlib
          cfg = pathlib.Path("wrangler.toml")
          text = cfg.read_text(encoding="utf-8")
          replacements = {
              "database_id": os.environ["D1_DATABASE_ID"],
              "WORKER_URL": os.environ["WORKER_URL"],
              "BOT_USERNAME": os.environ.get("BOT_USERNAME", ""),
              "BOT_ID": os.environ.get("BOT_ID", ""),
              "BOT_NAME": os.environ.get("BOT_NAME", ""),
          }
          for key, value in replacements.items():
              pattern = rf'^({re.escape(key)}\s*=\s*)"[^"]*"$'
              new, n = re.subn(pattern, lambda m: m.group(1) + '"' + value + '"', text, flags=re.M)
              if n != 1:
                  raise SystemExit(f"expected exactly one {key} assignment in wrangler.toml, found {n}")
              text = new
          cfg.write_text(text, encoding="utf-8")
          print("wrangler.toml configured")
          PY

      - name: Build Mini App shell
        env:
          BOT_USERNAME: ${{ vars.BOT_USERNAME }}
        run: npm run build:webapp

      # Schema first: new code may depend on new columns, old code never depends on their
      # absence. Migrations are forward-only, so this is safe to run on every deploy.
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply trix --remote

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Smoke test
        env:
          SMOKE_URL: ${{ vars.WORKER_URL }}
        run: node scripts/smoke.mjs
