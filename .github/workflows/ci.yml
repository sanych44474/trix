name: CI

# Typecheck + both test pools + Mini App build on every push and PR. All must be green before a
# deploy — the deploy workflow re-runs them behind the production approval gate as well.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Runs against REAL D1 inside workerd (vitest.config.ts), separate from the
      # node:test suite above -- covers D1 semantics (meta.changes, batch()) the
      # node:sqlite-backed harness can't promise. Scoped to a D1-only binding (no
      # [ai]), so it needs no Cloudflare credentials.
      - name: Test (Workers runtime)
        run: npm run test:workers

      # Catches a broken shell.html marker or a client fragment that no longer parses —
      # failures that would otherwise only surface at deploy time.
      - name: Build Mini App shell
        run: npm run build:webapp

      # Runtime dependencies only. Dev-tool advisories (wrangler's transitive tree) never reach
      # the deployed Worker and must not block a release.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
