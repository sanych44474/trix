
<div id="cc" class="cc hidden">
  <div class="cc-head">
    <button id="cc-back">&#8249;</button>
    <div id="cc-name"></div>
    <button id="cc-flag"></button>
  </div>
  <div class="cc-chips">
    <span class="chip" id="cc-comp" style="display:none"></span>
    <span class="chip" id="cc-cycle" style="display:none"></span>
  </div>
  <button id="cc-plan" class="lbtn" style="width:100%;margin:0 0 8px"></button>
  <div class="cc-save-row" style="margin-bottom:6px"><button id="cc-book-b" class="chipbtn"></button><button id="cc-tpl-b" class="chipbtn"></button></div>
  <div id="cc-ops" style="margin-bottom:8px"></div>
  <div class="card">
    <label id="cc-health-l" for="cc-health"></label>
    <textarea id="cc-health" rows="3"></textarea>
    <label id="cc-pers-l" for="cc-pers"></label>
    <textarea id="cc-pers" rows="3"></textarea>
    <label id="cc-bday-l" for="cc-bday"></label>
    <input id="cc-bday" placeholder="YYYY-MM-DD">
    <div class="cc-save-row"><button id="cc-save" class="lbtn"></button><span class="sub" id="cc-save-st"></span></div>
  </div>
  <div class="card" style="margin-top:10px">
    <label id="cc-note-l" for="cc-note"></label>
    <textarea id="cc-note" rows="2"></textarea>
    <div class="cc-save-row"><button id="cc-note-save" class="lbtn"></button><span class="sub" id="cc-note-st"></span></div>
  </div>
  <div id="cc-shared"></div>
  <div id="cc-billing"></div>
  <div id="cc-charts"></div>
</div>
<div id="qa" class="cc hidden">
  <div class="cc-head"><button id="qa-back">&#8249;</button><div id="qa-title" style="flex:1;font-weight:600"></div></div>
  <div id="qa-body"></div>
</div>
