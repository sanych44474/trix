        '400': {$ref: '#/components/responses/ValidationError'}
        '404': {$ref: '#/components/responses/NotFound'}
components:
  securitySchemes:
    telegramInitData: {type: apiKey, in: header, name: Authorization, description: 'Telegram Mini App initData sent as Authorization: tma <initData>.'}
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: {type: string, minLength: 8, maxLength: 128}
    IfMatch:
      name: If-Match
      in: header
      required: false
      schema: {type: string, maxLength: 128}
  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    ValidationError:
      description: Invalid request
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    Conflict:
      description: Optimistic concurrency conflict
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    Forbidden:
      description: Caller's role does not permit this action
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
  schemas:
    Envelope:
      type: object
      required: [data]
      properties:
        data: {}
        meta:
          type: object
          properties:
            version: {type: integer, const: 2}
            requestId: {type: string}
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [validation_error, unauthorized, forbidden, not_found, conflict, rate_limited, dependency_unavailable]
            message: {type: string}
            requestId: {type: string}
            details: {type: object}
    SettingsRequest:
      description: >-
        One action per request, each reading only its own fields
        (src/webapp/settingsApi.ts). Was `additionalProperties: true`, which let any field name
        through unchecked.
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [remToggle, vacation, lang, cycle, compete, feedback, export, export_json, leaveTrainer, deleteAccount]
        key: {type: string, description: 'action=remToggle: which reminder to flip'}
        off: {type: boolean, description: 'action=vacation: end it now'}
        days: {type: number, minimum: 1, maximum: 365, description: 'action=vacation'}
        lang:
          type: string
          enum: [en, uk]
          description: 'action=lang'
        on: {type: boolean, description: 'action=cycle | compete'}
        lastStart: {type: string, description: 'action=cycle: YYYY-MM-DD, not in the future'}
        len: {type: number, minimum: 20, maximum: 45, description: 'action=cycle: cycle length in days'}
        alias: {type: string, maxLength: 30, description: 'action=compete: leaderboard display name'}
        text: {type: string, maxLength: 1500, description: 'action=feedback'}
        confirm: {type: boolean, description: 'action=deleteAccount: must be true'}
    ProfileRequest:
      description: >-
        Every field is an optional patch -- src/webapp/profileApi.ts applies only what is
        present and valid. The goal/steps/water/quiet fields also accept null or "" to CLEAR
        back to the derived default, which is why they are not plain numbers. Was
        `additionalProperties: true`.
      type: object
      properties:
        name: {type: string, maxLength: 80}
        sex:
          type: string
          enum: [male, female]
        age: {type: number, minimum: 13, maximum: 120}
        heightCm: {type: number, minimum: 100, maximum: 250}
        weightKg: {type: number, minimum: 30, maximum: 300}
        goalWeight: {anyOf: [{type: number}, {type: 'null'}, {type: string, maxLength: 0}]}
        goal: {type: string}
        level:
          type: string
          enum: [beginner, intermediate, advanced]
        equipment: {type: string}
        dietPrefs: {type: string}
        limitations: {type: string, maxLength: 500}
        lifestyle:
          type: string
          enum: [sedentary, moderate, active]
        sleepSchedule:
          type: string
          enum: [morning, evening]
        reminderHour: {type: number, minimum: 0, maximum: 23}
        waterGoalMl: {anyOf: [{type: number}, {type: 'null'}, {type: string, maxLength: 0}]}
        stepsGoal: {anyOf: [{type: number}, {type: 'null'}, {type: string, maxLength: 0}]}
        waterEvery: {anyOf: [{type: number}, {type: 'null'}, {type: string, maxLength: 0}]}
        quietFrom: {anyOf: [{type: number}, {type: 'null'}, {type: string, maxLength: 0}]}
        quietTo: {anyOf: [{type: number}, {type: 'null'}, {type: string, maxLength: 0}]}
        trainingWeekdays:
          type: array
          maxItems: 7
          items: {type: integer, minimum: 1, maximum: 7}
        share:
          description: Client-only trainer-sharing consent; a falsy value is ignored by the handler.
          anyOf:
          - {type: 'null'}
          - type: object
            properties:
              body: {type: boolean}
              health: {type: boolean}
    TrainerProfileRequest:
      description: >-
        Create-or-update for the caller's own trainer profile (src/webapp/extrasApi.ts). Strings
        are truncated server-side to the lengths below; out-of-range numbers are dropped rather
        than rejected. `accepting` only applies to an existing profile. Was
        `additionalProperties: true`.
      type: object
      properties:
        name: {type: string, maxLength: 60}
        bio: {type: string, maxLength: 600}
        specialization: {type: string, maxLength: 120}
        approach: {type: string, maxLength: 600}
        city: {type: string, maxLength: 60}
        contact: {type: string, maxLength: 120}
        experienceYears:
          anyOf: [{type: number, minimum: 0, maximum: 60}, {type: 'null'}]
        priceOnline:
          anyOf: [{type: number, minimum: 0, maximum: 100000}, {type: 'null'}]
        accepting: {type: boolean, description: Taking new clients; ignored when creating.}
    MealPlanDay:
      type: object
      required: [label, meals]
      properties:
        label: {type: string}
        meals:
          type: array
          items: {$ref: '#/components/schemas/Meal'}
    GroceryLine:
      description: One aggregated shopping-list row (src/domain/groceryList.ts).
      type: object
      required: [food, grams, category]
      properties:
        food: {type: string, description: Display name, already localized}
        grams: {type: number}
        category:
          type: string
          enum: [produce, protein, dairy, grains, pantry, other]
    FoodSearchItem:
      type: object
      required: [name, per100]
      properties:
        name: {type: string}
        brand: {type: string}
        per100:
          type: object
          required: [kcal, p, f, c]
          properties:
            kcal: {type: number}
            p: {type: number}
            f: {type: number}
            c: {type: number}
    NutritionRequest:
      description: >-
        One action per request; each reads only its own fields (src/webapp/nutritionApi.ts).
        `index` addresses a logged meal, while dayIndex/mealIndex/itemIndex address the nested
        meal-PLAN shape (days[].meals[].items[]) -- they are different targets, which is why
        both exist. Was `additionalProperties: true`.
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [del, scale, grams, macros, recipe, recover, readd, dbsearch, dbadd, barcode,
                 grocery, grocery_send, mealplan_regen, mealplan_item_del, mealplan_item_scale,
                 mealplan_item_grams]
        index: {type: number, description: 'Logged-meal index: del | scale | grams | macros | recipe'}
        factor: {type: number, enum: [0.5, 1.5, 2], description: 'scale | mealplan_item_scale'}
        grams: {type: number, minimum: 1, maximum: 5000, description: 'grams | dbadd | mealplan_item_grams'}
        kcal: {type: number, minimum: 0, maximum: 5000, description: 'action=macros'}
        protein: {type: number, minimum: 0, maximum: 500, description: 'action=macros'}
        fats: {type: number, minimum: 0, maximum: 500, description: 'action=macros'}
        carbs: {type: number, minimum: 0, maximum: 500, description: 'action=macros'}
        ri: {type: number, description: 'action=readd: index into the recent-foods list'}
        q: {type: string, maxLength: 60, description: 'action=dbsearch'}
        code: {type: string, maxLength: 32, description: 'action=barcode: digits only'}
        name: {type: string, maxLength: 80, description: 'action=dbadd'}
        per100:
          type: object
          description: 'action=dbadd: per-100g macros of the picked food.'
          properties:
            kcal: {type: number}
            p: {type: number}
            f: {type: number}
            c: {type: number}
        days: {type: number, minimum: 1, maximum: 14, description: 'grocery | grocery_send'}
        dayIndex: {type: number, description: 'mealplan_item_*: index into mealPlan.days'}
        mealIndex: {type: number, description: 'mealplan_item_*: index into that day.s meals'}
        itemIndex: {type: number, description: 'mealplan_item_*: index into that meal.s items'}
    QuickLogRequest:
      description: >-
        Only `kind` is always required; every other field is read solely by the branch that
        needs it (src/webapp/quickLogApi.ts's QuickLogBody has them all optional). The spec
        previously marked all eight required, which described no request the app ever sends.
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [water, workout, steps, measure, checkin, food]
        text: {type: string, maxLength: 500, description: 'kind=measure | food'}
        ml: {type: number, minimum: 1, maximum: 3000, description: 'kind=water'}
        steps: {type: number, minimum: 0, maximum: 200000, description: 'kind=steps'}
        name: {type: string, maxLength: 80, description: 'kind=workout'}
        sets: {type: number, minimum: 1, maximum: 20, description: 'kind=workout'}
        reps: {type: number, minimum: 1, maximum: 1000, description: 'kind=workout'}
        weight: {type: number, minimum: 0, maximum: 1000, description: 'kind=workout'}
        energy: {type: number, minimum: 1, maximum: 5, description: 'kind=checkin'}
        sleep: {type: number, minimum: 1, maximum: 5, description: 'kind=checkin'}
        stress: {type: number, minimum: 1, maximum: 5, description: 'kind=checkin'}
    OnboardingRequest:
      type: object
      required: [sex, age, heightCm, weightKg, goal, level, equipment, dietPrefs, trainingWeekdays, limitations]
      properties:
        sex:
          type: string
          enum: [male, female]
        age: {type: integer, minimum: 13, maximum: 120}
        heightCm: {type: number, minimum: 100, maximum: 250}
        weightKg: {type: number, minimum: 30, maximum: 300}
        goal: {type: string}
        level:
          type: string
          enum: [beginner, intermediate, advanced]
        equipment: {type: string}
        dietPrefs: {type: string}
        trainingWeekdays:
          type: array
          minItems: 1
          maxItems: 7
          items: {type: integer, minimum: 1, maximum: 7}
        limitations: {type: string, maxLength: 500}
    ChallengeRequest:
      type: object
      required: [code]
      properties:
        code: {type: string, maxLength: 60}
    InjuryRequest:
      type: object
      required: [area, severity]
      properties:
        area: {type: string}
        severity:
          type: string
          enum: [mild, strong]
    RequestAction:
      type: object
      required: [id, action]
      properties:
        id: {type: integer, minimum: 1}
        action:
          type: string
          enum: [accept, decline]
    TextRequest:
      type: object
      required: [text]
      properties:
        text: {type: string, minLength: 1, maxLength: 2000}
    SaveWorkoutRequest:
      description: >-
        Matches validateSaveBody (src/webapp/workout.ts): only reps+weight are required on a
        set, since a reps exercise carries no seconds/meters and RPE is optional everywhere.
        `date` is omitted for today and only sent when back-filling. The spec previously
        required date and all five set fields, describing a request the app never sends.
      type: object
      required: [entries]
      properties:
        date: {type: string, format: date, description: Back-fill target; omit for today.}
        entries:
          type: array
          items:
            type: object
            required: [name, sets]
            properties:
              name: {type: string, maxLength: 80}
              rpe: {type: number, minimum: 0, maximum: 10, description: Effort for the whole exercise.}
              sets:
                type: array
                items:
                  type: object
                  required: [reps, weight]
                  properties:
                    reps: {type: number, minimum: 0, maximum: 1000}
                    weight: {type: number, minimum: 0, maximum: 1000}
                    seconds: {type: number, minimum: 1, maximum: 86400}
                    meters: {type: number, minimum: 1, maximum: 200000}
                    rpe: {type: number, minimum: 0, maximum: 10}
    RecoveryFactor:
      type: object
      required: [code, count]
      properties:
        code:
          type: string
          enum: [volume_above, cardio_above, low_energy, high_stress, poor_sleep, grinding_rpe]
        count: {type: integer}
    Meal:
      type: object
      required: [name, items, kcal, protein, fats, carbs]
      properties:
        name: {type: string}
        items:
          type: array
          items: {$ref: '#/components/schemas/MealItem'}
        kcal: {type: number}
        protein: {type: number}
        fats: {type: number}
        carbs: {type: number}
    MealItem:
      type: object
      required: [food, grams]
      properties:
        food: {type: string}
        grams: {type: number}
    CatalogExercise:
      type: object
      required: [id, name, muscle]
      properties:
        id: {type: string}
        name: {type: string}
        muscle: {type: string}
    PlanExercise:
      type: object
      required: [index, name, sets, startWeight, metric]
      properties:
        index: {type: integer}
        name: {type: string}
        sets: {type: string}
        startWeight: {type: string}
        metric: {type: string}
        technique: {type: string}
        videoUrl: {type: string}
        videoTitle: {type: string}
        ssGroup: {type: string}
        wmode:
          type: string
          enum: [total, perSide, perHand]
    PlanDay:
      type: object
      required: [weekday, name, muscleGroup, exercises]
      properties:
        weekday: {type: integer}
        name: {type: string}
        muscleGroup: {type: string}
        exercises:
          type: array
          items: {$ref: '#/components/schemas/PlanExercise'}
    ClientSummary:
      type: object
      required: [id, name, workoutPct, nutritionPct, atRisk, flagged]
      properties:
        id: {type: integer}
        name: {type: string}
        workoutPct: {type: number}
        nutritionPct: {type: number}
        atRisk: {type: boolean}
        flagged: {type: boolean}
        missedDates:
          type: array
          items: {type: string}
          minItems: 2
          maxItems: 2
    Dashboard:
      type: object
      required: [viewer, lang, today, weight, calendar, volume, conditioning, recovery, exercises, macros]
      properties:
        viewer:
          type: object
          required: [id, role, onboarded]
          properties:
            id: {type: integer}
            role:
              type: string
              enum: [solo, trainer, client]
            onboarded: {type: boolean}
        lang:
          type: string
          enum: [uk, en]
        today: {type: string}
        name: {type: string}
        weight:
          type: object
          properties:
            points:
              type: array
              items:
                type: object
                properties:
                  date: {type: string}
                  kg: {type: number}
                required: [date, kg]
            goal: {type: number}
            projection:
              type: object
              properties:
                slopePerWeek: {type: number}
                etaWeeks: {type: number}
                onTrack: {type: boolean}
                reached: {type: boolean}
              required: [slopePerWeek, onTrack, reached]
          required: [points]
        calendar:
          type: object
          properties:
            days:
              type: array
              items:
                type: object
                properties:
                  date: {type: string}
                  s:
                    type: string
                    enum: [done, missed, rest]
                required: [date, s]
            split:
              type: array
              items:
                type: object
                properties:
                  weekday: {type: integer}
                  group: {type: string}
                  n: {type: integer}
                required: [weekday, group, n]
            logs:
              type: array
              items:
                type: object
                properties:
                  date: {type: string}
                  done: {type: boolean}
                  ex:
                    type: array
                    items:
                      type: object
                      properties:
                        n: {type: string}
                        s: {type: integer}
                      required: [n, s]
                required: [date, done, ex]
          required: [days, split, logs]
        volume:
          type: array
          items:
            type: object
            properties:
              group:
                type: string
                enum: [legs, back, chest, shoulders, arms, core]
              sets: {type: integer}
              mev: {type: integer}
              mav: {type: integer}
              zone:
                type: string
                enum: [below, optimal, above]
            required: [group, sets, mev, mav, zone]
        conditioning:
          type: object
          properties:
            sessions: {type: integer}
            minutes: {type: integer}
            meters: {type: integer}
            zone:
              type: string
              enum: [below, optimal, above]
          required: [sessions, minutes, meters, zone]
        recovery:
          type: object
          properties:
            score: {type: integer}
            label:
              type: string
              enum: [great, good, fair, poor]
            factors:
              type: array
              items: {$ref: '#/components/schemas/RecoveryFactor'}
          required: [score, label, factors]
        measurements:
          type: array
          items:
            type: object
            properties:
              key: {type: string}
              points:
                type: array
                items:
                  type: object
                  properties:
                    date: {type: string}
                    v: {type: number}
                  required: [date, v]
            required: [key, points]
        exercises:
          type: array
          items:
            type: object
            properties:
              name: {type: string}
              group: {type: string}
              points:
                type: array
                items:
                  type: object
                  properties:
                    date: {type: string}
                    e1rm: {type: number}
                  required: [date, e1rm]
            required: [name, group, points]
        macros:
          type: object
          properties:
            targets:
              type: object
              properties:
                calories: {type: number}
                protein: {type: number}
                fats: {type: number}
                carbs: {type: number}
              required: [calories, protein, fats, carbs]
            days:
              type: array
              items:
                type: object
                properties:
                  date: {type: string}
                  kcal: {type: number}
                  p: {type: number}
                  f: {type: number}
                  c: {type: number}
                  training: {type: boolean}
                required: [date, kcal, p, f, c, training]
          required: [days]
        gamification:
          type: object
          properties:
            level: {type: integer}
            xp: {type: integer}
            intoLevel: {type: integer}
            needed: {type: integer}
            streak: {type: integer}
          required: [level, xp, intoLevel, needed]
        todayStats:
          type: object
          properties:
            waterMl: {type: number}
            waterGoal: {type: number}
            steps: {type: integer}
            stepsGoal: {type: integer}
          required: [waterMl, waterGoal, steps, stepsGoal]
        logForm:
          type: object
          properties:
            exercises:
              type: array
              items: {type: string}
          required: [exercises]
        trainer:
          type: object
          properties:
            clients:
              type: array
              items: {$ref: '#/components/schemas/ClientSummary'}
          required: [clients]
        owner:
          type: object
          properties:
            funnel:
              type: object
              properties:
                total: {type: integer}
                onboarded: {type: integer}
                active7: {type: integer}
                active30: {type: integer}
              required: [total, onboarded, active7, active30]
            ai:
              type: array
              items:
                type: object
                properties:
                  provider: {type: string}
                  calls: {type: integer}
                  fallbacks: {type: integer}
                  avgLatencyMs: {type: number}
                  tokens: {type: integer}
                required: [provider, calls, fallbacks, avgLatencyMs, tokens]
          required: [funnel, ai]
    WorkoutToday:
      type: object
      required: [date, weekday, exercises]
      properties:
        date: {type: string}
        weekday: {type: integer}
        title: {type: string}
        restDay: {type: boolean}
        muscleGroup: {type: string}
        exercises:
          type: array
          items:
            type: object
            required: [index, name, metric, sets]
            properties:
              index: {type: integer}
              name: {type: string}
              metric:
                type: string
                enum: [reps, time, distance]
              sets: {type: integer}
              reps: {type: integer}
              weightKg: {type: number}
              planSets: {type: string}
              planWeight: {type: string}
              technique: {type: string}
              videoUrl: {type: string}
              videoTitle: {type: string}
              last:
                type: array
                items:
                  type: object
                  properties:
                    w: {type: number}
                    r: {type: number}
                    sec: {type: number}
                    m: {type: number}
                  required: [w, r, sec, m]
              ssGroup: {type: string}
              wmode:
                type: string
                enum: [total, perSide, perHand]
              setsDone:
                type: array
                items:
                  type: object
                  properties:
                    weight: {type: number}
                    reps: {type: number}
                    seconds: {type: number}
                    meters: {type: number}
                    rpe: {type: number}
                  required: [weight, reps]
              rpe: {type: number}
              completed: {type: boolean}
              restSec: {type: number}
        saved:
          type: array
          items:
            type: object
            properties:
              name: {type: string}
              rpe: {type: number}
              sets:
                type: array
                items:
                  type: object
                  properties:
                    w: {type: number}
                    r: {type: number}
                    sec: {type: number}
                    m: {type: number}
                  required: [w, r, sec, m]
            required: [name, rpe, sets]
        recentDates:
          type: array
          items: {type: string}
        alreadyLogged: {type: boolean}
    WorkoutHistoryItem:
      type: object
      required: [date, title, n]
      properties:
        date: {type: string}
        title: {type: string}
        n: {type: integer}
    WorkoutCopyExercise:
      type: object
      required: [name, metric, sets, rpe]
      properties:
        name: {type: string}
        metric:
          type: string
          enum: [reps, time, distance]
        sets:
          type: array
          items:
            type: object
            properties:
              w: {type: number}
              r: {type: number}
              sec: {type: number}
              m: {type: number}
            required: [w, r, sec, m]
        rpe: {type: number}
    Plan:
      type: object
      required: [owner, editable, version, mesocycle, days, changes]
      properties:
        owner:
          type: object
          properties:
            id: {type: integer}
            name: {type: string}
          required: [id, name]
        editable: {type: boolean}
        version: {type: string}
        mesocycle:
          anyOf:
          - {type: 'null'}
          - type: object
            properties:
              phase:
                type: string
                enum: [hypertrophy, strength, peak, deload]
              weekInBlock: {type: integer}
              blockLength: {type: integer}
            required: [phase, weekInBlock, blockLength]
        days:
          type: array
          items: {$ref: '#/components/schemas/PlanDay'}
        changes:
          type: array
          description: Recent plan-change audit entries, newest first (max 10).
          items:
            type: object
            required: [source, summary, at]
            properties:
              source:
                type: string
                enum: [ai_coach, manual, injury_swap, trainer]
              summary: {type: string}
              at: {type: string, format: date-time}
    Nutrition:
      type: object
      required: [date, meals, totals]
      properties:
        date: {type: string}
        meals:
          type: array
          items:
            type: object
            properties:
              index: {type: integer}
              desc: {type: string}
              kcal: {type: number}
              protein: {type: number}
              fats: {type: number}
              carbs: {type: number}
              grams:
                type: [number, 'null']
              query:
                type: [string, 'null']
            required: [index, desc, kcal, protein, fats, carbs]
        totals:
          type: object
          properties:
            kcal: {type: number}
            protein: {type: number}
            fats: {type: number}
            carbs: {type: number}
          required: [kcal, protein, fats, carbs]
        targets:
          type: object
          properties:
            calories: {type: number}
            protein: {type: number}
            fats: {type: number}
            carbs: {type: number}
          required: [calories, protein, fats, carbs]
        isRestDay: {type: boolean}
        mealPlan:
          anyOf:
          - {type: 'null'}
          - type: object
            properties:
              days:
                type: array
                items: {$ref: '#/components/schemas/MealPlanDay'}
            required: [days]
        recent:
          type: array
          items:
            type: object
            properties:
              ri: {type: integer}
              desc: {type: string}
              kcal: {type: number}
              protein: {type: number}
            required: [ri, desc, kcal, protein]
    ProfilePayload:
      type: object
      required: [photos, referralLink, referredCount, profile, options, weekdays]
      properties:
        photos:
          type: array
          items:
            type: object
            properties:
              id: {type: integer}
              takenAt: {type: string}
            required: [id, takenAt]
        referralLink: {type: string, description: Empty string when BOT_USERNAME is unset (a fresh fork).}
        referredCount: {type: integer}
        profile:
          type: object
          properties:
            name: {type: string}
            goal: {type: string}
            level:
              type: string
              enum: [beginner, intermediate, advanced]
            equipment: {type: string}
            dietPrefs: {type: string}
            limitations: {type: string}
            goalWeight:
              type: [number, 'null']
            waterGoalMl:
              type: [number, 'null']
            waterEvery: {type: integer}
            stepsGoal:
              type: [integer, 'null']
            quietFrom:
              type: [integer, 'null']
            quietTo:
              type: [integer, 'null']
            reminderHour: {type: integer}
            trainingWeekdays:
              type: array
              items: {type: integer}
            share:
              anyOf:
              - {type: 'null'}
              - type: object
                properties:
                  body: {type: boolean}
                  health: {type: boolean}
                required: [body, health]
          required: [name, goal, level, equipment, dietPrefs, limitations, goalWeight, waterGoalMl, waterEvery, stepsGoal, quietFrom, quietTo, reminderHour, trainingWeekdays, share]
        options:
          type: object
          additionalProperties:
            type: array
            items:
              type: object
              properties:
                value: {type: string}
                label: {type: string}
              required: [value, label]
        weekdays:
          type: array
          items:
            type: object
            properties:
              value: {type: integer}
              label: {type: string}
            required: [value, label]
    SettingsPayload:
      type: object
      required: [onboarded, reminders, vacationUntil, lang, role, compete]
      properties:
        onboarded: {type: boolean}
        reminders:
          type: array
          items:
            type: object
            properties:
              key: {type: string}
              label: {type: string}
              'on': {type: boolean}
            required: [key, label, 'on']
        vacationUntil:
          type: [string, 'null']
        lang:
          type: string
          enum: [uk, en]
        role:
          type: string
          enum: [solo, trainer, client]
        cycle:
          anyOf:
          - {type: 'null'}
          - type: object
            properties:
              'on': {type: boolean}
              lastStart:
                type: [string, 'null']
              len: {type: integer}
            required: ['on', lastStart, len]
        compete:
          type: object
          properties:
            'on': {type: boolean}
            alias: {type: string}
          required: ['on', alias]
    BuddyInfo:
      type: object
      properties:
        name: {type: string}
        level: {type: integer}
        xp: {type: integer}
        intoLevel: {type: integer}
        needed: {type: integer}
        streak: {type: integer}
        weekWorkouts: {type: integer}
        myWeekWorkouts: {type: integer}
        week:
          type: array
          items:
            type: object
            properties:
              date: {type: string}
              ex:
                type: array
                items: {type: string}
            required: [date, ex]
        duel:
          type: object
          properties:
            myWins: {type: integer}
            theirWins: {type: integer}
            myStreak: {type: integer}
          required: [myWins, theirWins, myStreak]
      required: [name, level, xp, intoLevel, needed, streak, weekWorkouts, myWeekWorkouts, week, duel]
    ChallengesPayload:
      type: object
      required: [active, available, won]
      properties:
        active:
          type: array
          items:
            type: object
            properties:
              code: {type: string}
              emoji: {type: string}
              title: {type: string}
              current: {type: integer}
              target: {type: integer}
              pct: {type: number}
              done: {type: boolean}
              daysLeft: {type: integer}
            required: [code, emoji, title, current, target, pct, done, daysLeft]
        available:
          type: array
          items:
            type: object
            properties:
              code: {type: string}
