# Source of truth for /api/v2/* response/request shapes. Every response schema here is verified
# against the real handler code in src/webapp/*.ts, not guessed from the Mini App's own types --
# apps/mini-app/src/types.ts is generated FROM this file (npm run generate:contracts ->
# packages/contracts/generated.ts), not the other way around. When a handler's response shape
# changes, update this file first, regenerate, then fix whatever the mini-app typecheck flags.
#
# Regeneration note: openapi-typescript@7.13.0's own code imports `ts.factory` from the
# `typescript` package and crashes against this project's local `typescript@^7.0.2` (a
# different, incompatible module surface -- not just a stale peer-range warning). `npm run
# generate:contracts` therefore pins `npx -y openapi-typescript@7.13.0`, which resolves its own
# isolated (TS 5.x-compatible) dependency tree instead of the project's node_modules/typescript.
# Do not "fix" this by installing openapi-typescript as a local devDependency -- it will resolve
# to the shared local typescript@7 again and crash the same way.
openapi: 3.1.0
info: {title: trix v2 API, version: 2.0.0, description: Versioned REST contract for the React Mini App and shared application layer.}
servers:
- {url: /}
paths:
  /api/v2/dashboard:
    get:
      operationId: getDashboard
      security:
      - telegramInitData: []
      responses:
        '200':
          description: Dashboard snapshot
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Envelope'}
                - type: object
                  properties:
                    data: {$ref: '#/components/schemas/Dashboard'}
                  required: [data]
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v2/workout/today:
    get:
      operationId: getTodayWorkout
      security:
      - telegramInitData: []
      responses:
        '200':
          description: Guided workout payload
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Envelope'}
                - type: object
                  properties:
                    data: {$ref: '#/components/schemas/WorkoutToday'}
                  required: [data]
  /api/v2/workout/save:
    post:
      operationId: saveWorkout
      security:
      - telegramInitData: []
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SaveWorkoutRequest'}
      responses:
        '200':
          description: >-
            Saved workout, with the celebration payload saveWorkout() computes (SaveResult in
            src/webapp/workout.ts): personal records hit, newly earned badges, and level state.
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Envelope'}
                - type: object
                  properties:
                    data:
                      type: object
                      required: [ok, prExercises, newBadges, level, leveledUp, totalWorkouts]
                      properties:
                        ok: {const: true}
                        prExercises:
                          type: array
                          description: Exercises where this session set a new personal record.
                          items: {type: string}
                        newBadges:
                          type: array
                          description: Localized labels of achievements earned by this save.
                          items: {type: string}
                        level: {type: integer}
                        leveledUp: {type: boolean}
                        totalWorkouts: {type: integer}
                  required: [data]
        '400': {$ref: '#/components/responses/ValidationError'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v2/workout/history:
    get:
      operationId: getWorkoutHistory
      security:
      - telegramInitData: []
      responses:
        '200':
          description: Recent workout history
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Envelope'}
                - type: object
                  properties:
                    data:
                      type: array
                      items: {$ref: '#/components/schemas/WorkoutHistoryItem'}
                  required: [data]
  /api/v2/workout/past:
    get:
      operationId: getPastWorkout
      security:
      - telegramInitData: []
      parameters:
      - name: date
        in: query
        required: true
        schema: {type: string, format: date}
      responses:
        '200':
          description: Workout used as a repeat template
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Envelope'}
                - type: object
                  properties:
                    data:
                      type: array
                      items: {$ref: '#/components/schemas/WorkoutCopyExercise'}
                  required: [data]
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v2/workout/swap:
    get:
      operationId: getWorkoutSwaps
      security:
      - telegramInitData: []
      parameters:
      - name: index
        in: query
        required: true
        schema: {type: integer, minimum: 0, maximum: 50}
      responses:
        '200':
          description: Safe exercise alternatives
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Envelope'}
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        alternatives:
                          type: array
                          items: {type: string}
                  required: [data]
  /api/v2/workout/exinfo:
    get:
      operationId: getExerciseInfo
      security:
      - telegramInitData: []
      parameters:
      - name: name
        in: query
        required: true
        schema: {type: string, minLength: 2, maxLength: 80}
      responses:
        '200':
          description: Exercise technique information
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Envelope'}
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        technique: {type: string}
                        videoUrl: {type: string}
                        videoTitle: {type: string}
                  required: [data]
  /api/v2/workout/custom:
    post:
      operationId: addCustomExercise
      security:
      - telegramInitData: []
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, minLength: 2, maxLength: 200}
      responses:
        '200':
          description: Custom exercise
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Envelope'}
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        ok: {const: true}
                  required: [data]
        '400': {$ref: '#/components/responses/ValidationError'}
  /api/v2/workout/rest:
    post:
      operationId: startRestTimer
      security:
      - telegramInitData: []
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seconds]
              properties:
                seconds: {type: number, minimum: 30, maximum: 900}
      responses:
        '200':
          description: Rest timer scheduled
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Envelope'}
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        ok: {const: true}
                  required: [data]
        '400': {$ref: '#/components/responses/ValidationError'}
    delete:
      operationId: cancelRestTimer
      description: >-
        Cancels the caller's pending rest timer. Without this the minute-cron still delivers the
        Telegram "rest is over" push for a rest the user skipped in the app.
      security:
      - telegramInitData: []
      responses:
        '200':
          description: Rest timer cancelled (also returned when none was pending)
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Envelope'}
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        ok: {const: true}
                  required: [data]
  /api/v2/log:
    post:
      operationId: quickLog
      security:
      - telegramInitData: []
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/QuickLogRequest'}
      responses:
        '200':
          description: Logged activity
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Envelope'}
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        ok: {const: true}
                  required: [data]
        '400': {$ref: '#/components/responses/ValidationError'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v2/nutrition:
    get:
      operationId: getNutrition
      security:
      - telegramInitData: []
      responses:
        '200':
          description: Nutrition day
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Envelope'}
                - type: object
                  properties:
                    data: {$ref: '#/components/schemas/Nutrition'}
                  required: [data]
    post:
      operationId: editNutrition
      security:
      - telegramInitData: []
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NutritionRequest'}
      responses:
        '200':
          description: Updated nutrition day
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Envelope'}
                - type: object
                  properties:
                    data:
                      description: >-
                        Which fields are present depends on the request's `action`
                        (src/webapp/nutritionApi.ts). Was `additionalProperties: true`, which
                        generated `data: {[key: string]: unknown}` and pushed every consumer
                        into hand-declaring the shape.
                      type: object
                      properties:
                        ok: {type: boolean, description: Mutating actions (del/scale/grams/macros/readd/dbadd/mealplan_item_*)}
                        days:
                          description: 'mealplan_regen | mealplan_item_* | grocery: the refreshed plan'
                          type: array
                          items: {$ref: '#/components/schemas/MealPlanDay'}
                        lines:
                          description: 'action=grocery'
                          type: array
                          items: {$ref: '#/components/schemas/GroceryLine'}
                        items:
                          description: 'dbsearch | barcode'
                          type: array
                          items: {$ref: '#/components/schemas/FoodSearchItem'}
                        source:
                          description: 'dbsearch | barcode: which backend answered'
                          type: string
                          enum: [off, ai, fatsecret]
                        notFound: {type: boolean, description: 'action=barcode: code not in any database'}
                        text: {type: string, description: 'recipe | recover: the AI answer, empty when unavailable'}
                        done: {type: boolean, description: 'recipe | recover: nothing further to suggest'}
                  required: [data]
        '400': {$ref: '#/components/responses/ValidationError'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v2/plan:
    get:
      operationId: getPlan
      security:
      - telegramInitData: []
      parameters:
      - name: clientId
        in: query
        required: false
        schema: {type: integer, minimum: 1}
      responses:
        '200':
          description: Active plan
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Envelope'}
                - type: object
                  properties:
                    data: {$ref: '#/components/schemas/Plan'}
                  required: [data]
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      operationId: editPlan
      security:
      - telegramInitData: []
      parameters:
      - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                clientId: {type: integer, minimum: 1}
                weekday: {type: integer, minimum: 1, maximum: 7}
                index: {type: integer, minimum: -1, maximum: 12}
                action:
                  type: string
                  enum: [weight, sets, wmode, video, link, del, move, swap, add, meso, dayadd, daydel]
                value:
                  type: string
                  maxLength: 300
                  description: >-
                    The edit's payload for every action, including the new exercise name for
                    swap/add. This is what the Mini App sends; prefer it in new clients.
                name:
                  type: string
                  minLength: 2
                  maxLength: 80
                  deprecated: true
                  description: >-
                    Legacy spelling of `value` for swap/add only. The handler accepts it so older
                    payloads keep working; do not use it in new clients.
                expectName: {type: string, maxLength: 200}
                dir:
                  type: string
                  enum: [up, down]
                catalogId: {type: string, maxLength: 80}
                group:
                  description: >-
                    action=dayadd only: which muscle-group template to fill the new day from.
                    Same DAY_GROUPS table the bot's day picker uses (src/bot/planDays.ts).
                  type: string
                  enum: [chest, back, legs, shoulders, arms, full, core]
                'on': {type: boolean, description: 'action=meso only: start/stop periodization'}
      responses:
        '200':
          description: Updated plan (or {ok:true} for the meso toggle, which has no weekday/index)
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Envelope'}
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        ok: {const: true}
                        days:
                          type: array
                          items: {$ref: '#/components/schemas/PlanDay'}
                        version: {type: string}
                        changes:
                          type: array
                          description: The refreshed audit log, newest first, including this edit.
                          items:
                            type: object
                            required: [source, summary, at]
                            properties:
                              source:
                                type: string
                                enum: [ai_coach, manual, injury_swap, trainer]
                              summary: {type: string}
                              at: {type: string, format: date-time}
                  required: [data]
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v2/plan/catalog:
    get:
      operationId: searchPlanExercises
      security:
      - telegramInitData: []
      parameters:
      - name: q
        in: query
        required: true
        schema: {type: string, minLength: 2, maxLength: 80}
      responses:
        '200':
          description: Catalog exercises matching the query
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Envelope'}
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        items:
                          type: array
                          items: {$ref: '#/components/schemas/CatalogExercise'}
                  required: [data]
  /api/v2/onboarding:
    post:
      operationId: completeOnboarding
      security:
      - telegramInitData: []
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OnboardingRequest'}
      responses:
        '200':
          description: Onboarding accepted
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Envelope'}
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        ok: {const: true}
                        pending: {type: boolean}
                  required: [data]
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v2/profile:
    get:
      operationId: getProfile
      security:
      - telegramInitData: []
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Envelope'}
                - type: object
                  properties:
                    data: {$ref: '#/components/schemas/ProfilePayload'}
                  required: [data]
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      operationId: updateProfile
      security:
      - telegramInitData: []
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProfileRequest'}
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Envelope'}
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        ok: {const: true}
                  required: [data]
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v2/settings:
    get:
      operationId: getSettings
      security:
      - telegramInitData: []
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Envelope'}
                - type: object
                  properties:
                    data: {$ref: '#/components/schemas/SettingsPayload'}
                  required: [data]
    post:
      operationId: updateSettings
      security:
      - telegramInitData: []
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SettingsRequest'}
      responses:
        '200':
          description: Settings updated
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Envelope'}
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        ok: {type: boolean}
                        state: {$ref: '#/components/schemas/SettingsPayload'}
                  required: [data]
  /api/v2/buddy:
    get:
      operationId: getBuddy
      security:
      - telegramInitData: []
      responses:
        '200':
          description: Buddy progress
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Envelope'}
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        buddy:
                          anyOf:
                          - {type: 'null'}
                          - {$ref: '#/components/schemas/BuddyInfo'}
                  required: [data]
  /api/v2/challenges:
    get:
      operationId: listChallenges
      security:
      - telegramInitData: []
      responses:
        '200':
          description: Challenges
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Envelope'}
                - type: object
                  properties:
                    data: {$ref: '#/components/schemas/ChallengesPayload'}
                  required: [data]
    post:
      operationId: joinChallenge
      security:
      - telegramInitData: []
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChallengeRequest'}
      responses:
        '200':
          description: Challenge joined
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Envelope'}
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        ok: {const: true}
                  required: [data]
        '400': {$ref: '#/components/responses/ValidationError'}
  /api/v2/injuries:
    get:
      operationId: listInjuries
      security:
      - telegramInitData: []
      responses:
        '200':
          description: Injury history
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Envelope'}
                - type: object
                  properties:
                    data: {$ref: '#/components/schemas/InjuryPayload'}
                  required: [data]
    post:
      operationId: reportInjury
      security:
      - telegramInitData: []
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InjuryRequest'}
      responses:
        '200':
          description: Injury reported
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Envelope'}
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        ok: {const: true}
                  required: [data]
  /api/v2/boards:
    get:
      operationId: getLeaderboards
      security:
      - telegramInitData: []
      responses:
        '200':
          description: Leaderboards
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Envelope'}
                - type: object
                  properties:
                    data: {$ref: '#/components/schemas/BoardsPayload'}
                  required: [data]
  /api/v2/records:
    get:
      operationId: getPersonalRecords
      security:
      - telegramInitData: []
      responses:
        '200':
          description: Records and badges
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Envelope'}
                - type: object
                  properties:
                    data: {$ref: '#/components/schemas/RecordsPayload'}
                  required: [data]
  /api/v2/photo:
    get:
      operationId: getProgressPhoto
      security:
      - telegramInitData: []
      parameters:
      - name: id
        in: query
        required: true
        schema: {type: integer, minimum: 1}
      - name: tma
        in: query
        required: false
        schema: {type: string}
      responses:
        '200':
          description: Progress photo bytes
          content:
            image/jpeg:
              schema: {type: string, format: binary}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v2/photocompare:
    post:
      operationId: sendPhotoCompare
      security:
      - telegramInitData: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo, from, to]
              properties:
                photo: {type: string, format: binary}
                from: {type: string}
                to: {type: string}
      responses:
        '200':
          description: Sent to the viewer's own chat
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Envelope'}
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        ok: {type: boolean}
                  required: [data]
  /api/v2/weekcard:
    get:
      operationId: getWeekCard
      security:
      - telegramInitData: []
      parameters:
      - name: clientId
        in: query
        required: false
        schema: {type: integer, minimum: 1}
      responses:
        '200':
          description: Week card
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Envelope'}
                - type: object
                  properties:
                    data: {$ref: '#/components/schemas/WeekCardResponse'}
                  required: [data]
    post:
      operationId: sendWeekCard
      security:
      - telegramInitData: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties:
                photo: {type: string, format: binary}
      responses:
        '200':
          description: Sent to the viewer's own chat
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Envelope'}
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        ok: {type: boolean}
                  required: [data]
  /api/v2/plates:
    get:
      operationId: getPlates
      security:
      - telegramInitData: []
      parameters:
      - name: kg
        in: query
        required: true
        schema: {type: number, minimum: 0, maximum: 600}
      responses:
        '200':
          description: Plate loading and warm-up ramp
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Envelope'}
                - type: object
                  properties:
                    data: {$ref: '#/components/schemas/PlatesResponse'}
                  required: [data]
  /api/v2/library:
    get:
      operationId: getLibrary
      security:
      - telegramInitData: []
      responses:
        '200':
          description: Public shared program library
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Envelope'}
                - type: object
                  properties:
                    data: {$ref: '#/components/schemas/LibraryResponse'}
                  required: [data]
    post:
      operationId: takeLibraryProgram
      security:
      - telegramInitData: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: {type: string, maxLength: 60}
      responses:
        '200':
          description: Program adopted as the active plan
