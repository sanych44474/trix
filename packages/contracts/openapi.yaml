                        ok: {const: true}
                        blocked: {type: boolean}
                  required: [data]
        '400': {$ref: '#/components/responses/ValidationError'}
        '404': {$ref: '#/components/responses/NotFound'}
components:
  securitySchemes:
    telegramInitData: {type: apiKey, in: header, name: Authorization, description: 'Telegram Mini App initData sent as Authorization: tma <initData>.'}
    appSession: {type: apiKey, in: cookie, name: __Host-trix_session, description: 'Browser (web) session: the HttpOnly cookie set by a successful sign-in. Not used by the native app.'}
    bearerSession:
      type: http
      scheme: bearer
      bearerFormat: 64 lowercase hex characters
      description: >-
        Native app session: the sessionToken returned by a sign-in (auth routes, native client only),
        sent as Authorization: Bearer <sessionToken>. Used instead of the cookie.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: {type: string, minLength: 8, maxLength: 128}
    IfMatch:
      name: If-Match
      in: header
      required: false
      schema: {type: string, maxLength: 128}
  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    ValidationError:
      description: Invalid request
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    Conflict:
      description: Optimistic concurrency conflict
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    Forbidden:
      description: Caller's role does not permit this action
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    RateLimited:
      description: Too many authentication attempts
      headers:
        Retry-After: {schema: {type: string}}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
  schemas:
    AuthSession:
      type: object
      required: [authenticated]
      properties:
        authenticated: {type: boolean}
        accountId: {type: integer}
        method: {type: string, enum: [email, google, telegram, debug]}
        email: {type: [string, 'null'], format: email}
        googleLinked: {type: boolean, description: 'Only from GET /api/v2/auth/session'}
        sessionToken:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: >-
            Only for the native app (X-Client: native header and no Origin header). Send it as
            Authorization: Bearer. Browsers get the HttpOnly cookie instead and never see this field.
    AuthProviders:
      type: object
      required: [googleClientId, telegramAvailable, emailAvailable]
      properties:
        googleClientId: {type: [string, 'null']}
        telegramAvailable: {type: boolean}
        emailAvailable: {type: boolean, description: Email codes can be sent (Resend is configured)}
    GoogleNonceChallenge:
      type: object
      required: [challengeId, nonce, clientId, expiresInSeconds]
      properties:
        challengeId: {type: string, pattern: '^[0-9a-f]{32}$'}
        nonce: {type: string, pattern: '^[0-9a-f]{64}$'}
        clientId: {type: string}
        expiresInSeconds: {type: integer, const: 600}
    GoogleVerifyRequest:
      type: object
      required: [challengeId, idToken]
      properties:
        challengeId: {type: string, pattern: '^[0-9a-f]{32}$'}
        idToken: {type: string, minLength: 1, maxLength: 12000}
        lang: {type: string, enum: [uk, en]}
    TelegramLoginChallenge:
      type: object
      required: [challengeId, completionToken, matchCode, telegramUrl, expiresInSeconds]
      properties:
        challengeId: {type: string, pattern: '^[0-9a-f]{32}$'}
        completionToken: {type: string, pattern: '^[0-9a-f]{64}$'}
        matchCode: {type: string, pattern: '^[0-9]{4}$', description: 'Four digits shown in the app and in the Telegram prompt; the person checks they match before confirming'}
        telegramUrl: {type: string, format: uri}
        expiresInSeconds: {type: integer, const: 600}
    TelegramLoginStatus:
      type: object
      required: [verified, expired]
      properties:
        verified: {type: boolean}
        expired: {type: boolean}
    TelegramCompleteRequest:
      type: object
      required: [challengeId, completionToken]
      properties:
        challengeId: {type: string, pattern: '^[0-9a-f]{32}$'}
        completionToken: {type: string, pattern: '^[0-9a-f]{64}$'}
    EmailCodeStartRequest:
      type: object
      required: [email]
      properties:
        email: {type: string, format: email, maxLength: 254}
        lang: {type: string, enum: [uk, en]}
    EmailCodeChallenge:
      type: object
      required: [challengeId, expiresInSeconds]
      properties:
        challengeId: {type: string, pattern: '^[0-9a-f]{32}$'}
        expiresInSeconds: {type: integer, const: 600}
    EmailCodeVerifyRequest:
      type: object
      required: [email, challengeId, code]
      properties:
        email: {type: string, format: email, maxLength: 254}
        challengeId: {type: string, pattern: '^[0-9a-f]{32}$'}
        code: {type: string, pattern: '^[0-9]{6}$'}
        lang: {type: string, enum: [uk, en]}
    PushDeviceRequest:
      type: object
      required: [token, platform]
      properties:
        token: {type: string, pattern: '^[A-Za-z0-9_:\-]{20,4096}$', description: FCM registration token}
        platform: {type: string, enum: [android, ios]}
        appVersion: {type: string, maxLength: 32, description: 'Longer values are cut to 32 characters, not rejected'}
    PushDeviceRemoveRequest:
      type: object
      required: [token]
      properties:
        token: {type: string, pattern: '^[A-Za-z0-9_:\-]{20,4096}$'}
    PushOk:
      type: object
      required: [ok]
      properties:
        ok: {const: true}
    PlainError:
      description: Error body of the routes that are not wrapped in the v2 envelope
      type: object
      required: [error]
      properties:
        error: {type: string}
    CoachAction:
      type: object
      required: [label, kind]
      properties:
        label: {type: string}
        kind: {type: string, enum: [add, delete, swap, weight, sets, harder, easier, feedback, none]}
        weekday: {type: integer}
        index: {type: integer}
        exercise: {type: string}
        value: {type: string}
        note: {type: string}
    Envelope:
      type: object
      required: [data]
      properties:
        data: {}
        meta:
          type: object
          properties:
            version: {type: integer, const: 2}
            requestId: {type: string}
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
            requestId: {type: string}
            details: {type: object}
    SettingsRequest:
      description: >-
        One action per request, each reading only its own fields
        (src/webapp/settingsApi.ts). Was `additionalProperties: true`, which let any field name
        through unchecked.
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [remToggle, vacation, lang, cycle, compete, feedback, export, export_json, leaveTrainer, deleteAccount]
        key: {type: string, description: 'action=remToggle: which reminder to flip'}
        off: {type: boolean, description: 'action=vacation: end it now'}
        days: {type: number, minimum: 1, maximum: 365, description: 'action=vacation'}
        lang:
          type: string
          enum: [en, uk]
          description: 'action=lang'
        on: {type: boolean, description: 'action=cycle | compete'}
        lastStart: {type: string, description: 'action=cycle: YYYY-MM-DD, not in the future'}
        len: {type: number, minimum: 20, maximum: 45, description: 'action=cycle: cycle length in days'}
        alias: {type: string, maxLength: 30, description: 'action=compete: leaderboard display name'}
        text: {type: string, maxLength: 1500, description: 'action=feedback'}
        confirm: {type: boolean, description: 'action=deleteAccount: must be true'}
        delivery:
          type: string
          enum: [download]
          description: 'action=export | export_json: "download" asks for the file in the response (any other value sends it to the Telegram chat)'
    ProfileRequest:
      description: >-
        Every field is an optional patch -- src/webapp/profileApi.ts applies only what is
        present and valid. The goal/steps/water/quiet fields also accept null or "" to CLEAR
        back to the derived default, which is why they are not plain numbers. Was
        `additionalProperties: true`.
      type: object
      properties:
        name: {type: string, maxLength: 80}
        sex:
          type: string
          enum: [male, female]
        age: {type: number, minimum: 13, maximum: 120}
        heightCm: {type: number, minimum: 100, maximum: 250}
        weightKg: {type: number, minimum: 30, maximum: 300}
        goalWeight: {anyOf: [{type: number}, {type: 'null'}, {type: string, maxLength: 0}]}
        goal: {type: string}
        level:
          type: string
          enum: [beginner, intermediate, advanced]
        equipment: {type: string}
        dietPrefs: {type: string}
        limitations: {type: string, maxLength: 500}
        lifestyle:
          type: string
          enum: [sedentary, moderate, active]
        sleepSchedule:
          type: string
          enum: [morning, evening]
        sessionMinutes: {type: number, enum: [30, 45, 60, 90]}
        reminderHour: {type: number, minimum: 0, maximum: 23}
        waterGoalMl: {anyOf: [{type: number}, {type: 'null'}, {type: string, maxLength: 0}]}
        stepsGoal: {anyOf: [{type: number}, {type: 'null'}, {type: string, maxLength: 0}]}
        waterEvery: {anyOf: [{type: number}, {type: 'null'}, {type: string, maxLength: 0}]}
        quietFrom: {anyOf: [{type: number}, {type: 'null'}, {type: string, maxLength: 0}]}
        quietTo: {anyOf: [{type: number}, {type: 'null'}, {type: string, maxLength: 0}]}
        trainingWeekdays:
          type: array
          maxItems: 7
          items: {type: integer, minimum: 1, maximum: 7}
        share:
          description: Client-only trainer-sharing consent; a falsy value is ignored by the handler.
          anyOf:
          - {type: 'null'}
          - type: object
            properties:
              body: {type: boolean}
              health: {type: boolean}
    TrainerProfileRequest:
      description: >-
        Create-or-update for the caller's own trainer profile (src/webapp/extrasApi.ts). Strings
        are truncated server-side to the lengths below; out-of-range numbers are dropped rather
        than rejected. `accepting` only applies to an existing profile. Was
        `additionalProperties: true`.
      type: object
      properties:
        name: {type: string, maxLength: 60}
        bio: {type: string, maxLength: 600}
        specialization: {type: string, maxLength: 120}
        approach: {type: string, maxLength: 600}
        city: {type: string, maxLength: 60}
        contact: {type: string, maxLength: 120}
        experienceYears:
          anyOf: [{type: number, minimum: 0, maximum: 60}, {type: 'null'}]
        priceOnline:
          anyOf: [{type: number, minimum: 0, maximum: 100000}, {type: 'null'}]
        accepting: {type: boolean, description: Taking new clients; ignored when creating.}
    MealPlanDay:
      type: object
      required: [label, meals]
      properties:
        label: {type: string}
        meals:
          type: array
          items: {$ref: '#/components/schemas/Meal'}
    GroceryLine:
      description: One aggregated shopping-list row (src/domain/groceryList.ts).
      type: object
      required: [food, grams, category]
      properties:
        food: {type: string, description: Display name, already localized}
        grams: {type: number}
        category:
          type: string
          enum: [produce, protein, dairy, grains, pantry, other]
    FoodSearchItem:
      type: object
      required: [name, per100]
      properties:
        name: {type: string}
        brand: {type: string}
        per100:
          type: object
          required: [kcal, p, f, c]
          properties:
            kcal: {type: number}
            p: {type: number}
            f: {type: number}
            c: {type: number}
        portionG: {type: number, description: "A typical portion in grams (the app's own catalog only)"}
    ReadyProgram:
      type: object
      required: [id, place, audience, level, goal, daysPerWeek, minutes, name, summary, days]
      properties:
        id: {type: string}
        place: {type: string, enum: [gym, dumbbells, bodyweight]}
        audience: {type: string, enum: [men, women, all]}
        level: {type: string, enum: [beginner, intermediate, advanced]}
        goal: {type: string, enum: [fatloss, muscle, recomp, strength, endurance]}
        daysPerWeek: {type: integer}
        minutes: {type: integer}
        name: {type: string}
        summary: {type: string}
        days:
          type: array
          items:
            type: object
            required: [title, exercises]
            properties:
              title: {type: string}
              exercises:
                type: array
                items:
                  type: object
                  required: [name, sets]
                  properties:
                    name: {type: string}
                    sets: {type: string}
    ChatThread:
      type: object
      required: [peer, messages]
      properties:
        peer:
          type: object
          required: [id, name, isTrainer]
          properties:
            id: {type: integer}
            name: {type: string}
            isTrainer: {type: boolean, description: The peer is the viewer's trainer}
        messages:
          type: array
          items:
            type: object
            required: [id, fromMe, text, createdAt, read]
            properties:
              id: {type: integer}
              fromMe: {type: boolean}
              text: {type: string}
              createdAt: {type: string}
              read: {type: boolean, description: 'For own messages: the peer has opened the thread since'}
    LoggedFoodItem:
      type: object
      required: [desc, kcal, protein, fats, carbs]
      properties:
        desc: {type: string, maxLength: 80}
        kcal: {type: number, minimum: 0, maximum: 3000}
        protein: {type: number, minimum: 0, maximum: 300}
        fats: {type: number, minimum: 0, maximum: 300}
        carbs: {type: number, minimum: 0, maximum: 500}
        grams: {type: number, minimum: 0, maximum: 3000}
        query: {type: string, maxLength: 60}
    NutritionRequest:
      description: >-
        One action per request; each reads only its own fields (src/webapp/nutritionApi.ts).
        `index` addresses a logged meal, while dayIndex/mealIndex/itemIndex address the nested
        meal-PLAN shape (days[].meals[].items[]) -- they are different targets, which is why
        both exist. Was `additionalProperties: true`.
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [del, scale, grams, macros, recipe, recover, readd, dbsearch, dbadd, barcode,
                 grocery, grocery_send, mealplan_regen, mealplan_item_del, mealplan_item_scale,
                 mealplan_item_grams, add_items]
        items:
          type: array
          maxItems: 12
          description: 'action=add_items: the confirmed items of a meal-photo estimate.'
          items: {$ref: '#/components/schemas/LoggedFoodItem'}
        index: {type: number, description: 'Logged-meal index: del | scale | grams | macros | recipe'}
        factor: {type: number, enum: [0.5, 1.5, 2], description: 'scale | mealplan_item_scale'}
        grams: {type: number, minimum: 1, maximum: 5000, description: 'grams | dbadd | mealplan_item_grams'}
        kcal: {type: number, minimum: 0, maximum: 5000, description: 'action=macros'}
        protein: {type: number, minimum: 0, maximum: 500, description: 'action=macros'}
        fats: {type: number, minimum: 0, maximum: 500, description: 'action=macros'}
        carbs: {type: number, minimum: 0, maximum: 500, description: 'action=macros'}
        ri: {type: number, description: 'action=readd: index into the recent-foods list'}
        q: {type: string, maxLength: 60, description: 'action=dbsearch'}
        code: {type: string, maxLength: 32, description: 'action=barcode: digits only'}
        name: {type: string, maxLength: 80, description: 'action=dbadd'}
        brand: {type: string, maxLength: 40, description: 'action=dbadd: the picked result.s brand, if any'}
        per100:
          type: object
          description: 'action=dbadd: per-100g macros of the picked food.'
          properties:
            kcal: {type: number}
            p: {type: number}
            f: {type: number}
            c: {type: number}
        days: {type: number, minimum: 1, maximum: 14, description: 'grocery | grocery_send'}
        dayIndex: {type: number, description: 'mealplan_item_*: index into mealPlan.days'}
        mealIndex: {type: number, description: 'mealplan_item_*: index into that day.s meals'}
        itemIndex: {type: number, description: 'mealplan_item_*: index into that meal.s items'}
    QuickLogRequest:
      description: >-
        Only `kind` is always required; every other field is read solely by the branch that
        needs it (src/webapp/quickLogApi.ts's QuickLogBody has them all optional). The spec
        previously marked all eight required, which described no request the app ever sends.
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [water, workout, steps, measure, checkin, food, cardio]
        text: {type: string, maxLength: 500, description: 'kind=measure | food | cardio (cardio: time and/or distance, e.g. "30 min 8 km")'}
        key: {type: string, enum: [row, bike, run, walk, swim, ellipt, rope, other], description: 'kind=cardio'}
        ml: {type: number, minimum: 1, maximum: 3000, description: 'kind=water'}
        steps: {type: number, minimum: 0, maximum: 200000, description: 'kind=steps'}
        name: {type: string, maxLength: 80, description: 'kind=workout'}
        sets: {type: number, minimum: 1, maximum: 20, description: 'kind=workout'}
        reps: {type: number, minimum: 1, maximum: 1000, description: 'kind=workout'}
        weight: {type: number, minimum: 0, maximum: 1000, description: 'kind=workout'}
        energy: {type: number, minimum: 1, maximum: 5, description: 'kind=checkin'}
        sleep: {type: number, minimum: 1, maximum: 5, description: 'kind=checkin'}
        stress: {type: number, minimum: 1, maximum: 5, description: 'kind=checkin'}
    OnboardingRequest:
      type: object
      required: [sex, age, heightCm, weightKg, goal, level, equipment, dietPrefs, trainingWeekdays, limitations]
      properties:
        sex:
          type: string
          enum: [male, female]
        age: {type: integer, minimum: 13, maximum: 120}
        heightCm: {type: number, minimum: 100, maximum: 250}
        weightKg: {type: number, minimum: 30, maximum: 300}
        goal: {type: string}
        level:
          type: string
          enum: [beginner, intermediate, advanced]
        equipment: {type: string}
        dietPrefs: {type: string}
        trainingWeekdays:
          type: array
          minItems: 1
          maxItems: 7
          items: {type: integer, minimum: 1, maximum: 7}
        limitations: {type: string, maxLength: 500}
        baselineLifts: {type: string, maxLength: 200, description: 'Optional current lifts, e.g. "bench 60kg, squat 80kg, deadlift 100kg" — sets starting weights'}
        sessionMinutes:
          type: integer
          enum: [30, 45, 60, 90]
        lifestyle:
          type: string
          enum: [sedentary, moderate, active]
        sleepSchedule:
          type: string
          enum: [morning, evening]
        timezone: {type: string, maxLength: 64, description: IANA zone from the device; saved only when the profile has none}
        share:
          type: object
          description: A trainer's client's answer to what the trainer may see; ignored for other roles.
          properties:
            body: {type: boolean}
            health: {type: boolean}
    ChallengeRequest:
      type: object
      required: [code]
      properties:
        code: {type: string, maxLength: 60}
    InjuryRequest:
      type: object
      required: [area, severity]
      properties:
        area: {type: string}
        severity:
          type: string
          enum: [mild, strong]
    RequestAction:
      type: object
      required: [id, action]
      properties:
        id: {type: integer, minimum: 1}
        action:
          type: string
          enum: [accept, decline]
    TextRequest:
      type: object
      required: [text]
      properties:
        text: {type: string, minLength: 1, maxLength: 2000}
    SaveWorkoutRequest:
      description: >-
        Matches validateSaveBody (src/webapp/workout.ts): only reps+weight are required on a
        set, since a reps exercise carries no seconds/meters and RPE is optional everywhere.
        `date` is omitted for today and only sent when back-filling. The spec previously
        required date and all five set fields, describing a request the app never sends.
      type: object
      required: [entries]
      properties:
        date: {type: string, format: date, description: Back-fill target; omit for today.}
        durationSec: {type: number, minimum: 1, maximum: 18000, description: Measured session length; dropped if out of range.}
        restTotalSec: {type: number, minimum: 0, description: Measured rest inside the session; ignored without durationSec.}
        entries:
          type: array
          items:
            type: object
            required: [name, sets]
            properties:
              name: {type: string, maxLength: 80}
              planName: {type: string, maxLength: 80, description: The plan exercise this entry replaced via an in-session swap.}
              rpe: {type: number, minimum: 0, maximum: 10, description: Effort for the whole exercise.}
              sets:
                type: array
                items:
                  type: object
                  required: [reps, weight]
                  properties:
                    reps: {type: number, minimum: 0, maximum: 1000}
                    weight: {type: number, minimum: 0, maximum: 1000}
                    seconds: {type: number, minimum: 1, maximum: 86400}
                    meters: {type: number, minimum: 1, maximum: 200000}
                    rpe: {type: number, minimum: 0, maximum: 10}
    RecoveryFactor:
      type: object
      required: [code, count]
      properties:
        code:
          type: string
          enum: [volume_above, cardio_above, low_energy, high_stress, poor_sleep, grinding_rpe]
        count: {type: integer}
    Meal:
      type: object
      required: [name, items, kcal, protein, fats, carbs]
      properties:
        name: {type: string}
        items:
          type: array
          items: {$ref: '#/components/schemas/MealItem'}
        kcal: {type: number}
        protein: {type: number}
        fats: {type: number}
        carbs: {type: number}
    MealItem:
      type: object
      required: [food, grams]
      properties:
        food: {type: string}
        grams: {type: number}
    CatalogExercise:
      type: object
      required: [id, name, muscle]
      properties:
        id: {type: string}
        name: {type: string}
        muscle: {type: string}
    PlanExercise:
      type: object
      required: [index, name, sets, startWeight, metric]
      properties:
        index: {type: integer}
        name: {type: string}
        sets: {type: string}
        startWeight: {type: string}
        metric: {type: string}
        technique: {type: string}
        note: {type: string, description: "The plan author's (trainer's) comment for this exercise."}
        videoUrl: {type: string}
        videoTitle: {type: string}
        ssGroup: {type: string}
        wmode:
          type: string
          enum: [total, perSide, perHand]
    PlanDay:
      type: object
      required: [weekday, name, muscleGroup, exercises]
      properties:
        weekday: {type: integer}
        name: {type: string}
        muscleGroup: {type: string}
        exercises:
          type: array
          items: {$ref: '#/components/schemas/PlanExercise'}
    ClientSummary:
      type: object
      required: [id, name, workoutPct, nutritionPct, atRisk, flagged]
      properties:
        id: {type: integer}
        name: {type: string}
        workoutPct: {type: number}
        nutritionPct: {type: number}
        atRisk: {type: boolean}
        flagged: {type: boolean}
        missedDates:
          type: array
          items: {type: string}
          minItems: 2
          maxItems: 2
        onboarded: {type: boolean, description: Finished the intake interview.}
        plan:
          type: string
          enum: [active, draft, none]
          description: An assigned plan, only a draft waiting for the trainer, or nothing yet.
    Dashboard:
      type: object
      required: [viewer, lang, today, weight, calendar, volume, conditioning, recovery, exercises, macros]
      properties:
        viewer:
          type: object
          required: [id, role, onboarded]
          properties:
            id: {type: integer}
            role:
              type: string
              enum: [solo, trainer, client]
            onboarded: {type: boolean}
            planPending: {type: boolean, description: 'Questionnaire submitted, plan still being built'}
            profileGaps:
              type: array
              description: Profile fields still missing (asked by the Today fine-tune card); absent for trainers and before onboarding
              items: {type: string, enum: [sex, age, heightCm, weightKg, sessionMinutes, lifestyle, dietPrefs]}
        lang:
          type: string
          enum: [uk, en]
        today: {type: string}
        name: {type: string}
        weight:
          type: object
          properties:
            points:
              type: array
              items:
                type: object
                properties:
                  date: {type: string}
                  kg: {type: number}
                required: [date, kg]
            goal: {type: number}
            projection:
              type: object
              properties:
                slopePerWeek: {type: number}
                etaWeeks: {type: number}
                onTrack: {type: boolean}
                reached: {type: boolean}
              required: [slopePerWeek, onTrack, reached]
          required: [points]
        calendar:
          type: object
          properties:
            days:
              type: array
              items:
                type: object
                properties:
                  date: {type: string}
                  s:
                    type: string
                    enum: [done, missed, rest]
                required: [date, s]
            split:
              type: array
              items:
                type: object
                properties:
                  weekday: {type: integer}
                  group: {type: string}
                  n: {type: integer}
                required: [weekday, group, n]
            logs:
              type: array
              items:
                type: object
                properties:
                  date: {type: string}
                  done: {type: boolean}
                  ex:
                    type: array
                    items:
                      type: object
                      properties:
                        n: {type: string}
                        s: {type: integer}
                      required: [n, s]
                required: [date, done, ex]
            learnedMuscles:
              type: array
              description: Muscles for logged exercise names the body map's rules don't recognise (learned once from the catalog or AI); the app adds them to its muscle lookup.
              items:
                type: object
                properties:
                  name: {type: string}
                  primary: {type: array, items: {type: string}}
                  secondary: {type: array, items: {type: string}}
                required: [name, primary, secondary]
          required: [days, split, logs]
        whatsnew:
          type: object
          description: The latest release note (raw *bold* text in the user's language) until the user dismisses it in the app or already got it in the chat.
          properties:
            version: {type: string}
            text: {type: string}
          required: [version, text]
        recoverySwap:
          type: object
          description: Today's planned muscles are still recovering and a later plan day's are ready -- offer swapping the two days.
          properties:
            weekday: {type: integer}
            other: {type: integer}
            todayGroup: {type: string}
            otherGroup: {type: string}
            tired: {type: array, items: {type: string}}
            because: {type: array, items: {type: string}}
          required: [weekday, other, todayGroup, otherGroup, tired, because]
        week:
          type: object
          description: This week so far -- muscle balance score, balanced-week run towards the balance_streak_4 badge, and the weekly quests with live progress.
          properties:
            weekStart: {type: string}
            balance: {type: integer}
            balanceStreak: {type: integer}
            balanceGoal: {type: integer}
            questXp: {type: integer}
            quests:
              type: array
              items:
                type: object
                properties:
                  code: {type: string}
                  kind:
                    type: string
                    enum: [workouts, muscle_sets, balance, water_days, food_days, steps_days]
                  target: {type: number}
                  current: {type: number}
                  done: {type: boolean}
                  muscle: {type: string}
                required: [code, kind, target, current, done]
          required: [weekStart, balance, balanceStreak, balanceGoal, questXp, quests]
        badges:
          type: array
          description: Every earned badge; the app celebrates the ones it has not shown before.
          items:
            type: object
            properties:
              code: {type: string}
              label: {type: string}
            required: [code, label]
        volume:
          type: array
          items:
            type: object
            properties:
              group:
                type: string
                enum: [legs, back, chest, shoulders, arms, core]
              sets: {type: number, description: "Working sets; an assisting muscle counts half a set, so it can end in .5"}
              mev: {type: integer}
              mav: {type: integer}
              zone:
                type: string
                enum: [below, optimal, above]
            required: [group, sets, mev, mav, zone]
        conditioning:
          type: object
          properties:
            sessions: {type: integer}
            minutes: {type: integer}
            meters: {type: integer}
            zone:
              type: string
              enum: [below, optimal, above]
          required: [sessions, minutes, meters, zone]
        recovery:
          type: object
          properties:
            score: {type: integer}
            label:
              type: string
              enum: [great, good, fair, poor]
            factors:
              type: array
              items: {$ref: '#/components/schemas/RecoveryFactor'}
          required: [score, label, factors]
        sex:
          type: string
          enum: [male, female]
          description: Profile sex, used only to pick the body-map figure.
        bodyFat:
          type: object
          description: U.S. Navy tape-measure body-fat estimate from the newest waist/neck(/hips); about ±3-4 pp.
          properties:
            date: {type: string}
            pct: {type: number}
          required: [date, pct]
        measurements:
          type: array
          items:
            type: object
            properties:
              key: {type: string}
              points:
                type: array
                items:
                  type: object
                  properties:
                    date: {type: string}
                    v: {type: number}
                  required: [date, v]
            required: [key, points]
        exercises:
          type: array
          items:
            type: object
            properties:
              name: {type: string}
              group: {type: string}
              points:
                type: array
                items:
                  type: object
                  properties:
                    date: {type: string}
                    e1rm: {type: number}
                  required: [date, e1rm]
            required: [name, group, points]
        macros:
          type: object
          properties:
            targets:
              type: object
              properties:
                calories: {type: number}
                protein: {type: number}
                fats: {type: number}
                carbs: {type: number}
              required: [calories, protein, fats, carbs]
            restTargets:
              type: object
              description: The plan's rest-day target (lower carbs/kcal), when it has one.
              properties:
                calories: {type: number}
                protein: {type: number}
                fats: {type: number}
                carbs: {type: number}
              required: [calories, protein, fats, carbs]
            days:
              type: array
              items:
                type: object
                properties:
                  date: {type: string}
                  kcal: {type: number}
                  p: {type: number}
                  f: {type: number}
                  c: {type: number}
                  training: {type: boolean}
                required: [date, kcal, p, f, c, training]
          required: [days]
        gamification:
          type: object
          properties:
            level: {type: integer}
            xp: {type: integer}
            intoLevel: {type: integer}
            needed: {type: integer}
            streak: {type: integer}
          required: [level, xp, intoLevel, needed]
        todayStats:
          type: object
          properties:
            waterMl: {type: number}
            waterGoal: {type: number}
            steps: {type: integer}
            stepsGoal: {type: integer}
          required: [waterMl, waterGoal, steps, stepsGoal]
        logForm:
          type: object
          properties:
            exercises:
              type: array
              items: {type: string}
            minutes:
              type: integer
              description: Estimated length of today's plan day in minutes (0 when there is none).
          required: [exercises]
        trainer:
          type: object
          properties:
            clients:
              type: array
              items: {$ref: '#/components/schemas/ClientSummary'}
          required: [clients]
        owner:
          type: object
          properties:
            funnel:
              type: object
              properties:
                total: {type: integer}
                onboarded: {type: integer}
                active7: {type: integer}
                active30: {type: integer}
