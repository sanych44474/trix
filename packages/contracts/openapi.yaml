  /api/v2/photo:
    get:
      operationId: getProgressPhoto
      description: Progress photo bytes. Errors are plain text (not the v2 error envelope).
      security:
      - telegramInitData: []
      - appSession: []
      - bearerSession: []
      parameters:
      - name: id
        in: query
        required: true
        schema: {type: integer, minimum: 1}
      - name: tma
        in: query
        required: false
        description: Telegram initData for <img> tags, which cannot send headers
        schema: {type: string}
      responses:
        '200':
          description: Progress photo bytes
          content:
            image/jpeg:
              schema: {type: string, format: binary}
        '400': {description: 'id missing or not a positive integer (plain text "bad request")', content: {text/plain: {schema: {type: string}}}}
        '401': {description: 'Not signed in (plain text "unauthorized")', content: {text/plain: {schema: {type: string}}}}
        '404': {description: 'Not the owner, not their trainer, or no such photo (plain text "not found")', content: {text/plain: {schema: {type: string}}}}
    post:
      operationId: uploadProgressPhoto
      description: >-
        Uploads a progress photo for the caller: JPEG, PNG or WebP up to 10 MB, typed from the file
        bytes (the client's claimed type is ignored). Not a v2 envelope: success is {ok: true}
        and errors are {error: "<text>"}, not {error: {code, message}}.
      security:
      - telegramInitData: []
      - appSession: []
      - bearerSession: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties:
                photo: {type: string, format: binary}
      responses:
        '200':
          description: Stored. sentToTrainer is true when the trainer was sent a copy of the photo.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: {const: true}
                  sentToTrainer: {const: true}
        '400':
          description: No photo field in the form (error "bad request")
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlainError'}
        '401':
          description: Not signed in (plain text "unauthorized")
          content:
            text/plain:
              schema: {type: string}
        '413':
          description: Larger than 10 MB (error "too_large")
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlainError'}
        '415':
          description: Not a JPEG, PNG or WebP image (error "unsupported_media_type")
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlainError'}
        '502':
          description: Photo storage or Telegram failed (error "dependency_unavailable")
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlainError'}
        '503':
          description: No photo storage and no Telegram chat for the caller (error "storage_unavailable")
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlainError'}
