    post:
      operationId: editNutrition
      security:
      - telegramInitData: []
      - appSession: []
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NutritionRequest'}
      responses:
        '200':
          description: Updated nutrition day
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Envelope'}
                - type: object
                  properties:
                    data:
                      description: >-
                        Which fields are present depends on the request's `action`
                        (src/webapp/nutritionApi.ts). Was `additionalProperties: true`, which
                        generated `data: {[key: string]: unknown}` and pushed every consumer
                        into hand-declaring the shape.
                      type: object
                      properties:
                        ok: {type: boolean, description: Mutating actions (del/scale/grams/macros/readd/dbadd/mealplan_item_*)}
                        days:
                          description: 'mealplan_regen | mealplan_item_* | grocery: the refreshed plan'
                          type: array
                          items: {$ref: '#/components/schemas/MealPlanDay'}
                        lines:
                          description: 'action=grocery'
                          type: array
                          items: {$ref: '#/components/schemas/GroceryLine'}
                        items:
                          description: 'dbsearch | barcode'
                          type: array
                          items: {$ref: '#/components/schemas/FoodSearchItem'}
                        source:
                          description: 'dbsearch | barcode: which backend answered'
                          type: string
                          enum: [trix, off, ai, fatsecret]
                        notFound: {type: boolean, description: 'action=barcode: code not in any database'}
                        text: {type: string, description: 'recipe | recover: the AI answer, empty when unavailable'}
                        done: {type: boolean, description: 'recipe | recover: nothing further to suggest'}
                  required: [data]
        '400': {$ref: '#/components/responses/ValidationError'}
        '409': {description: "action=grocery_send with no Telegram chat (error.code conflict, error.message no_telegram_chat). The client shares the list itself.", content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
  /api/v2/plan:
    get:
      operationId: getPlan
      security:
      - telegramInitData: []
      - appSession: []
      parameters:
      - name: clientId
        in: query
        required: false
        schema: {type: integer, minimum: 1}
      responses:
        '200':
          description: Active plan
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Envelope'}
                - type: object
                  properties:
                    data: {$ref: '#/components/schemas/Plan'}
                  required: [data]
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      operationId: editPlan
      security:
      - telegramInitData: []
      - appSession: []
      parameters:
      - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                clientId: {type: integer, minimum: 1}
                weekday: {type: integer, minimum: 1, maximum: 7}
                index: {type: integer, minimum: -1, maximum: 12}
                action:
                  type: string
                  enum: [weight, sets, wmode, video, link, del, move, swap, add, note, technique, meso, dayadd, daydel, dayswap, fitkit, difficulty]
                value:
                  type: string
                  maxLength: 1000
                  description: >-
                    The edit's payload for every action, including the new exercise name for
                    swap/add, the comment for note (empty clears it; up to 300 characters kept)
                    and the text for technique. This is what the Mini App sends; prefer it in new clients.
                name:
                  type: string
                  minLength: 2
                  maxLength: 80
                  deprecated: true
                  description: >-
                    Legacy spelling of `value` for swap/add only. The handler accepts it so older
                    payloads keep working; do not use it in new clients.
                expectName: {type: string, maxLength: 200}
                dir:
                  type: string
                  enum: [up, down]
                  description: 'action=move (reorder within the day) and action=difficulty (up = harder, down = easier)'
                catalogId: {type: string, maxLength: 80}
                freeExerciseId: {type: string, maxLength: 120, description: 'action=add from the exercise library: the free-exercise-db id (sets canonicalName, reuses cached steps)'}
                group:
                  description: >-
                    action=dayadd only: which muscle-group template to fill the new day from.
                    Same DAY_GROUPS table the bot's day picker uses (src/bot/planDays.ts).
                  type: string
                  enum: [chest, back, legs, shoulders, arms, full, core]
                'on': {type: boolean, description: 'action=meso only: start/stop periodization'}
                other: {type: integer, minimum: 1, maximum: 7, description: 'action=dayswap only: the plan day that trades weekdays with `weekday`'}
                equipment:
                  type: string
                  enum: ['full gym', 'home basics (dumbbells, bands)', 'dumbbells only', 'bodyweight only']
                  description: 'action=fitkit only: change the profile equipment first, then fit the plan to it'
      responses:
        '200':
          description: Updated plan (or {ok:true} for the meso toggle, which has no weekday/index)
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Envelope'}
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        ok: {const: true}
                        days:
                          type: array
                          items: {$ref: '#/components/schemas/PlanDay'}
                        version: {type: string}
                        swapped: {type: integer, description: 'action=fitkit only: exercises swapped or removed'}
                        changes:
                          type: array
                          description: The refreshed audit log, newest first, including this edit.
                          items:
                            type: object
                            required: [source, summary, at]
                            properties:
                              source:
                                type: string
                                enum: [ai_coach, manual, injury_swap, trainer]
                              summary: {type: string}
                              at: {type: string, format: date-time}
                  required: [data]
        '409': {$ref: '#/components/responses/Conflict'}
