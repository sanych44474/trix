# Source of truth for /api/v2/* response/request shapes. Every response schema here is verified
# against the real handler code in src/webapp/*.ts, not guessed from the Mini App's own types --
# apps/mini-app/src/types.ts is generated FROM this file (npm run generate:contracts ->
# packages/contracts/generated.ts), not the other way around. When a handler's response shape
# changes, update this file first, regenerate, then fix whatever the mini-app typecheck flags.
#
# Regeneration note: openapi-typescript@7.13.0's own code imports `ts.factory` from the
# `typescript` package and crashes against this project's local `typescript@^7.0.2` (a
# different, incompatible module surface -- not just a stale peer-range warning). `npm run
# generate:contracts` therefore pins `npx -y openapi-typescript@7.13.0`, which resolves its own
# isolated (TS 5.x-compatible) dependency tree instead of the project's node_modules/typescript.
# Do not "fix" this by installing openapi-typescript as a local devDependency -- it will resolve
# to the shared local typescript@7 again and crash the same way.
openapi: 3.1.0
info: {title: trix v2 API, version: 2.0.0, description: Versioned REST contract for the React Mini App and shared application layer.}
servers:
- {url: /}
paths:
  /api/v2/auth/session:
    get:
      operationId: getAuthSession
      description: Who the caller is. An anonymous caller gets authenticated=false with HTTP 200.
      security:
      - {}
      - telegramInitData: []
      - appSession: []
      - bearerSession: []
      responses:
        '200':
          description: Current Telegram, Google, email, or anonymous session
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Envelope'}
                - type: object
                  properties:
                    data: {$ref: '#/components/schemas/AuthSession'}
                  required: [data]
  /api/v2/auth/email/start:
    post:
      operationId: startEmailSignIn
      description: >-
        Emails a six-digit code valid for 10 minutes. When the caller is already signed in, the
        code links the email to that account instead of creating a new one.
      security:
      - {}
      - telegramInitData: []
      - appSession: []
      - bearerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmailCodeStartRequest'}
      responses:
        '200':
          description: One-time code sent
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Envelope'}
                - type: object
                  properties:
                    data: {$ref: '#/components/schemas/EmailCodeChallenge'}
                  required: [data]
        '400':
          description: Not a valid email address (error.code invalid_email)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '403':
          description: Request origin not allowed (error.code origin_forbidden)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '502':
          description: The code email could not be sent (error.code email_delivery_failed)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '503':
          description: Email sign-in is not configured (error.code auth_unavailable)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
  /api/v2/auth/email/verify:
    post:
      operationId: verifyEmailSignIn
      description: >-
        Checks the code and signs in, creating the account on first use. Web: the response sets the
        HttpOnly session cookie. Native app (X-Client: native header, no Origin header): the response
        carries sessionToken and sets no cookie.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmailCodeVerifyRequest'}
      responses:
        '200':
          description: Signed in
          headers:
            Set-Cookie: {schema: {type: string}, description: 'Web only; not sent to the native client'}
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Envelope'}
                - type: object
                  properties:
                    data: {$ref: '#/components/schemas/AuthSession'}
                  required: [data]
        '400':
          description: Malformed email, challenge id or code (error.code invalid_code)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '401':
          description: Code wrong, expired, or used up after 5 attempts (error.code invalid_code)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '403':
          description: Request origin not allowed (error.code origin_forbidden) or account blocked (error.code account_unavailable)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '409':
          description: The email belongs to another account (error.code email_in_use)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503':
          description: Email sign-in is not configured (error.code auth_unavailable)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
  /api/v2/auth/logout:
    post:
      operationId: logoutEmailSession
      description: >-
        Revokes the session sent as bearer token or cookie (if any) and clears the cookie. Works
        without a session too.
      security:
      - {}
      - appSession: []
      - bearerSession: []
      responses:
        '200':
          description: Session revoked (when one was sent) and cookie cleared
          headers:
            Set-Cookie: {schema: {type: string}}
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Envelope'}
                - type: object
                  properties:
                    data:
                      type: object
                      required: [ok]
                      properties:
                        ok: {const: true}
                  required: [data]
        '403':
          description: Request origin not allowed (error.code origin_forbidden)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
  /api/v2/auth/providers:
    get:
      operationId: getAuthProviders
      security: []
      responses:
        '200':
          description: Public provider configuration for the sign-in screen
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Envelope'}
                - type: object
                  properties:
                    data: {$ref: '#/components/schemas/AuthProviders'}
                  required: [data]
  /api/v2/app/config:
    get:
      operationId: getAppConfig
      description: >-
        Update gate for the native app. Below minVersionCode the app blocks until it updates; below
        latestVersionCode it offers a background update. Cached for 5 minutes.
      security: []
      responses:
        '200':
          description: Native app version requirements
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Envelope'}
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        android:
                          type: object
                          properties:
                            minVersionCode: {type: integer, minimum: 1}
                            latestVersionCode: {type: integer, minimum: 1}
                          required: [minVersionCode, latestVersionCode]
                      required: [android]
                  required: [data]
  /api/v2/auth/google/nonce:
    post:
      operationId: startGoogleSignIn
      description: >-
        Starts a Google sign-in. Returns the nonce to put into the native Google ID token request;
        valid for 10 minutes. The request body is ignored.
      security:
      - {}
      - telegramInitData: []
      - appSession: []
      - bearerSession: []
      responses:
        '200':
          description: Short-lived nonce for a native Google ID token request
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Envelope'}
                - type: object
                  properties:
                    data: {$ref: '#/components/schemas/GoogleNonceChallenge'}
                  required: [data]
        '403':
          description: Request origin not allowed (error.code origin_forbidden)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503':
          description: Google sign-in is not configured (error.code google_unavailable)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
  /api/v2/auth/google/verify:
    post:
      operationId: verifyGoogleSignIn
      description: >-
        Verifies the Google ID token (signature, audience, issuer, expiry and the nonce from
        /api/v2/auth/google/nonce) and signs in. Session delivery is the same as for
        /api/v2/auth/email/verify.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GoogleVerifyRequest'}
      responses:
        '200':
          description: Google ID token verified; session created
          headers:
            Set-Cookie: {schema: {type: string}, description: 'Web only; not sent to the native client'}
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Envelope'}
                - type: object
                  properties:
                    data: {$ref: '#/components/schemas/AuthSession'}
                  required: [data]
        '400':
          description: challengeId or idToken missing (error.code invalid_google_token)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '401':
          description: >-
            Challenge expired, unknown or already used (error.code invalid_google_challenge), or the
            token or nonce did not verify (error.code invalid_google_token)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '403':
          description: Request origin not allowed (error.code origin_forbidden) or account blocked (error.code account_unavailable)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '409':
          description: The Google account or its email is linked to another TRIX account (error.code identity_in_use)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503':
          description: Google sign-in is not configured (error.code google_unavailable)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
  /api/v2/auth/telegram/start:
    post:
      operationId: startTelegramCodeSignIn
      description: >-
        Starts a Telegram sign-in. Returns the bot deep link and a four-digit matchCode. The person
        opens the link, checks that the code matches, and taps Confirm in the bot. Then
        /api/v2/auth/telegram/complete with the completionToken signs in. Needs no session.
      security: []
      responses:
        '200':
          description: One-time Telegram bot deep link and match code
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Envelope'}
                - type: object
                  properties:
                    data: {$ref: '#/components/schemas/TelegramLoginChallenge'}
                  required: [data]
        '403':
          description: Request origin not allowed (error.code origin_forbidden)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503':
          description: Telegram login is not configured (error.code telegram_unavailable)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
  /api/v2/auth/telegram/status:
    get:
      operationId: getTelegramCodeSignInStatus
      security: []
      parameters:
      - in: query
        name: challengeId
        required: true
        schema: {type: string, pattern: '^[0-9a-f]{32}$'}
      responses:
        '200':
          description: Whether the Telegram bot confirmed the one-time login link
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Envelope'}
                - type: object
                  properties:
                    data: {$ref: '#/components/schemas/TelegramLoginStatus'}
                  required: [data]
        '400':
          description: challengeId is not 32 lowercase hex characters (error.code invalid_challenge)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
  /api/v2/auth/telegram/complete:
    post:
      operationId: completeTelegramCodeSignIn
      description: >-
        Signs in once the bot has confirmed the login. Needs the completionToken from
        /api/v2/auth/telegram/start, which binds the login to the browser or app that started it.
        Session delivery is the same as for /api/v2/auth/email/verify.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TelegramCompleteRequest'}
      responses:
        '200':
          description: Login confirmed; session created
          headers:
            Set-Cookie: {schema: {type: string}, description: 'Web only; not sent to the native client'}
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Envelope'}
                - type: object
                  properties:
                    data: {$ref: '#/components/schemas/AuthSession'}
                  required: [data]
        '400':
          description: challengeId or completionToken missing or malformed (error.code invalid_challenge)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '401':
          description: Unknown, expired or already used challenge, or completionToken does not match (error.code invalid_challenge)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '403':
          description: Request origin not allowed (error.code origin_forbidden) or account blocked (error.code account_unavailable)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '409':
          description: The person has not confirmed in Telegram yet; retry after they do (error.code telegram_not_confirmed)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /api/v2/push/devices:
    post:
      operationId: registerPushDevice
      description: >-
        The native app registers its FCM token after sign-in, so pushes reach accounts with no
        Telegram chat. Registering the same token again is harmless. Not a v2 envelope: success is
        {ok: true} and errors are {error: "<text>"}.
      security:
      - telegramInitData: []
      - appSession: []
      - bearerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PushDeviceRequest'}
      responses:
        '200':
          description: Registered
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PushOk'}
        '400':
          description: Token or platform missing or malformed, or the body is not application/json or over 16 KB
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlainError'}
        '401':
          description: Not signed in
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlainError'}
    delete:
      operationId: unregisterPushDevice
      description: >-
        Removes the token on sign-out. The JSON body is sent with the DELETE request. Not a v2
        envelope (see POST).
      security:
      - telegramInitData: []
      - appSession: []
      - bearerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PushDeviceRemoveRequest'}
      responses:
        '200':
          description: Removed (also when the token was not registered)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PushOk'}
        '400':
          description: Token missing or malformed, or the body is not application/json or over 16 KB
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlainError'}
        '401':
          description: Not signed in
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlainError'}
  /api/v2/dashboard:
    get:
      operationId: getDashboard
      security:
      - telegramInitData: []
      - appSession: []
      responses:
        '200':
          description: Dashboard snapshot
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Envelope'}
                - type: object
                  properties:
                    data: {$ref: '#/components/schemas/Dashboard'}
                  required: [data]
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v2/workout/today:
    get:
      operationId: getTodayWorkout
      security:
      - telegramInitData: []
      - appSession: []
      responses:
        '200':
          description: Guided workout payload
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Envelope'}
                - type: object
                  properties:
                    data: {$ref: '#/components/schemas/WorkoutToday'}
                  required: [data]
  /api/v2/workout/save:
    post:
      operationId: saveWorkout
      security:
      - telegramInitData: []
      - appSession: []
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SaveWorkoutRequest'}
      responses:
        '200':
          description: >-
            Saved workout, with the celebration payload saveWorkout() computes (SaveResult in
            src/webapp/workout.ts): personal records hit, newly earned badges, and level state.
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Envelope'}
                - type: object
                  properties:
                    data:
                      type: object
                      required: [ok, prExercises, newBadges, level, leveledUp, totalWorkouts]
                      properties:
                        ok: {const: true}
                        prExercises:
                          type: array
                          description: Exercises where this session set a new personal record.
                          items: {type: string}
                        newBadges:
                          type: array
                          description: Localized labels of achievements earned by this save.
                          items: {type: string}
                        level: {type: integer}
                        leveledUp: {type: boolean}
                        totalWorkouts: {type: integer}
                  required: [data]
        '400': {$ref: '#/components/responses/ValidationError'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v2/workout/history:
    get:
      operationId: getWorkoutHistory
      security:
      - telegramInitData: []
      - appSession: []
      responses:
        '200':
          description: Recent workout history
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Envelope'}
                - type: object
                  properties:
                    data:
                      type: array
                      items: {$ref: '#/components/schemas/WorkoutHistoryItem'}
                  required: [data]
  /api/v2/workout/past:
    get:
      operationId: getPastWorkout
      security:
      - telegramInitData: []
      - appSession: []
      parameters:
      - name: date
        in: query
        required: true
        schema: {type: string, format: date}
      responses:
        '200':
          description: Workout used as a repeat template
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Envelope'}
                - type: object
                  properties:
                    data:
                      type: array
                      items: {$ref: '#/components/schemas/WorkoutCopyExercise'}
                  required: [data]
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v2/workout/swap:
    get:
      operationId: getWorkoutSwaps
      security:
      - telegramInitData: []
      - appSession: []
      parameters:
      - name: index
        in: query
        required: true
        schema: {type: integer, minimum: 0, maximum: 50}
      - name: name
        in: query
        required: false
        description: The plan exercise to find alternatives for; wins over index when it matches.
        schema: {type: string, maxLength: 80}
      - name: muscle
        in: query
        required: false
        description: >-
          A typed muscle ("трицепс", "glutes"): up to five exercises for it. Text that is not a
          muscle returns no alternatives and muscle=null (the app then adds it as a custom exercise).
        schema: {type: string, maxLength: 40}
      responses:
        '200':
          description: Up to five same-muscle alternatives that fit the person's equipment
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Envelope'}
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        alternatives:
                          type: array
                          items:
                            type: object
                            properties:
                              id: {type: string}
                              name: {type: string}
                            required: [id, name]
                        muscle:
                          type: string
                          nullable: true
                          description: The body-map muscle a typed query matched, else null.
                      required: [alternatives]
                  required: [data]
  /api/v2/workout/steps:
    get:
      operationId: getTechniqueSteps
      description: >-
        Short step-by-step technique for a free-exercise-db exercise (the logger's technique
        pictures), in the caller's language; condensed/translated once and cached.
      security:
      - telegramInitData: []
      - appSession: []
      parameters:
      - name: id
        in: query
        required: true
        schema: {type: string, minLength: 1, maxLength: 120}
      responses:
        '200':
          description: The steps (empty when the source has none or the AI was unavailable)
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Envelope'}
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        steps: {type: array, items: {type: string}}
                        name: {type: string, description: "The exercise's name in the caller's language (English title for en)"}
                      required: [steps, name]
                  required: [data]
        '404': {description: Not a free-exercise-db id}
  /api/v2/workout/exinfo:
    get:
      operationId: getExerciseInfo
      security:
      - telegramInitData: []
      - appSession: []
      parameters:
      - name: name
        in: query
        required: true
        schema: {type: string, minLength: 2, maxLength: 80}
      responses:
        '200':
          description: Exercise technique information
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Envelope'}
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        technique: {type: string}
                        videoUrl: {type: string}
                        videoTitle: {type: string}
                  required: [data]
  /api/v2/inbox:
    get:
      operationId: getInbox
      description: The Mini App's notification feed, newest first (last 40), with the unread count.
      security:
      - telegramInitData: []
      - appSession: []
      responses:
        '200':
          description: Feed items
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Envelope'}
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        unread: {type: integer}
                        items:
                          type: array
                          items:
                            type: object
                            properties:
                              id: {type: integer}
                              kind: {type: string, enum: [plan_assigned, plan_changed, message, badge, progression, feedback_done, squad_pr, squad_week]}
                              params: {type: object, additionalProperties: true}
                              createdAt: {type: string}
                              read: {type: boolean}
                            required: [id, kind, params, createdAt, read]
                      required: [unread, items]
                  required: [data]
  /api/v2/inbox/read:
    post:
      operationId: markInboxRead
      description: Marks every feed item read.
      security:
      - telegramInitData: []
      - appSession: []
      responses:
        '200':
          description: Done
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Envelope'}
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        ok: {const: true}
                  required: [data]
  /api/v2/whatsnew:
    get:
      operationId: getWhatsNew
      description: The latest release note. The Mini App shows it once, until the user dismisses it.
      security:
      - telegramInitData: []
      - appSession: []
      responses:
        '200':
          description: Release note as Telegram HTML and as plain text
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Envelope'}
                - type: object
                  properties:
                    data:
                      type: object
                      required: [version, html, text]
                      properties:
                        version: {type: string}
                        html: {type: string}
                        text: {type: string}
                  required: [data]
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v2/whatsnew/seen:
    post:
      operationId: markWhatsNewSeen
      description: Records that the user dismissed the current release note, so it is not shown again on any device.
      security:
      - telegramInitData: []
      - appSession: []
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: false
        description: Ignored. The server marks the latest release as seen.
        content:
          application/json:
            schema:
              type: object
              properties:
