          application/json:
            schema: {$ref: '#/components/schemas/SettingsRequest'}
      responses:
        '200':
          description: >-
            Settings updated. action=export or export_json: data is {ok} when the file was sent to the
            Telegram chat, or {ok: false, reason: "empty"} when there is nothing to export. With
            delivery=download, or for an account with no Telegram chat, the handler builds the file,
