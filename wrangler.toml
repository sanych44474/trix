name = "trix"
main = "src/index.ts"
# [2026-09-10] Bumped from 2025-05-01 (16 months stale). Reviewed every flag that became
# default in between: the only ones this Worker could touch are Node-compatible global
# timers (2026-02-10) and require()-returns-default-export (2026-01-22). Neither applies —
# the only timer use (src/ai/workersai.ts) is typed ReturnType<typeof setTimeout> and passes
# the handle straight back to clearTimeout, and there is no require() in src/. The rest are
# WebSocket / Python / Durable Object / stream flags this Worker does not use, or additive
# node:* modules. Re-check the flags page before the next bump.
compatibility_date = "2026-09-10"
compatibility_flags = ["nodejs_compat"]
# account_id is intentionally NOT committed — wrangler reads CLOUDFLARE_ACCOUNT_ID from the
# environment (set it in .dev.vars for local work, or as a repo secret for CI deploys).

# Cron every minute: onboarding-recovery sweep + retry of failed AI calls run each tick
# (so a silent-hung user is answered within ~1 min); reminders are timezone/date-deduped in code.
[triggers]
crons = ["* * * * *"]

[observability]
enabled = true
# Logs alone are not tracing: `observability.enabled` does NOT turn on traces, which need
# their own flag. Traces are what show WHERE a cron tick spent its subrequest budget — the
# limit this scheduler is actually designed around (Workers Free: 50 external subrequests
# per invocation). Instrumentation is automatic; no code change needed. Head sampling is
# left at the default: ~1.4k cron ticks/day plus webhooks is not a high-traffic workload.
[observability.traces]
enabled = true

# Static assets: the Mini App shell (public/app.html, built by scripts/build-webapp.mjs at deploy
# time) is served at GET /app straight from Cloudflare's edge — no Worker invocation, no bundle
# bloat. html_handling defaults to serving /app.html for /app; every non-asset path (/, /api/*,
# /webhook, /admin/*, /v, cron) still falls through to the Worker.
[assets]
directory = "public"

# Cloudflare Workers AI binding (free, on-platform) — used as a fallback provider.
[ai]
binding = "AI"

# Cloudflare D1 (SQLite) — primary datastore, in-network (no external DB hangs).
[[d1_databases]]
binding = "DB"
database_name = "trix"
# Replace with your own D1 id: `npx wrangler d1 create trix` prints it.
database_id = "00000000-0000-0000-0000-000000000000"

# Non-secret vars. Secrets (TELEGRAM_BOT_TOKEN, TELEGRAM_WEBHOOK_SECRET, GEMINI_API_KEY,
# GROQ_API_KEY, OLLAMA_API_KEY, OPENROUTER_API_KEY, ADMIN_SECRET, YOUTUBE_API_KEY) are set
# with `wrangler secret put`. YOUTUBE_API_KEY (YouTube Data API v3) powers exercise technique
# shorts (cache-first; ~100 search.list calls/day on the free quota).
# EXERCISES_API_KEY (API Ninjas) is only used by scripts/seed-exercises.mjs, not at runtime.
#
# Deployment identity (WORKER_URL, BOT_USERNAME, BOT_ID, BOT_NAME) is placeholder-only here so
# no one's bot is baked into the source tree. Local dev overrides these from .dev.vars; the
# deploy workflow substitutes the real values from repo variables before `wrangler deploy`.
[vars]
# Public worker origin — powers the Mini App dashboard buttons (/app). Leave unset in local dev
# (wrangler dev) to enable the ?debugUser= bypass and hide the buttons.
WORKER_URL = ""
# Your bot's @username (no @), numeric id and display name. BOT_ID + BOT_USERNAME let the Worker
# skip a getMe round-trip per webhook; leave them empty and grammY fetches it once instead.
BOT_USERNAME = ""
BOT_ID = ""
BOT_NAME = ""
# Gemini leads ONLY for plan/translate (native responseSchema = most reliable structured
# JSON). [2026-09-10] Re-benchmarked live: the 3.x models are NOT broken as the old note here
# claimed — 3.5-flash answered in ~1 s and 3-flash-preview/3.1-flash-lite/gemma-4-26b all
# responded fine. Free-tier latency swings hard between days (3.5-flash measured 7.6 s one day
# and 0.98 s the next), so treat any single benchmark as a snapshot, not a verdict — that
# volatility is exactly why the ladder below is deep. Only gemma-4-31b-it was reproducibly
# broken across two days (HTTP 500 / timeout) and has been dropped.
# Gemini ladder (verified available to this key via ListModels, ordered strongest → most
# reliable). Each model is a SEPARATE quota/load bucket, so the deep ladder rides out the
# free-tier 503/429 storms. Plan/translate try the whole ladder (quality first); fast kinds
# only reach Gemini as a deep fallback behind Groq.
#   gemini-3.5-flash      — strongest flash (plan primary)
#   gemini-3-flash-preview— Gemini 3 Flash
#   gemini-2.5-flash      — reliable workhorse (native responseSchema)
#   gemini-2.5-flash-lite — fast, light
#   gemini-3.1-flash-lite — extra bucket
#   gemma-4-31b-it / gemma-4-26b-a4b-it — open-weight fallbacks (gemini.ts omits thinkingConfig for Gemma)
# Order: strongest first, then reliable workhorses, then OPEN-weight + timeout-prone preview
# models LAST. Benchmark showed 3.5-flash/2.5-flash fail FAST (503) under load while
# 3-flash-preview / 3.1-flash-lite TIME OUT — so they sit at the tail to not starve the
# Groq fallback. (Gemini 3 Flash + Gemma 4 31B are both present, per request.)
GEMINI_MODEL = "gemini-3.5-flash"
GEMINI_LIGHT_MODEL = "gemini-2.5-flash-lite"
GEMINI_FALLBACK_MODELS = "gemini-2.5-flash,gemini-2.5-flash-lite,gemini-3.1-flash-lite,gemini-3-flash-preview,gemma-4-26b-a4b-it"
# Groq Cloud — fast, reliable JSON, generous free tier; LEADS for fast conversational kinds.
# [2026-09-10] Re-verified against GET /openai/v1/models. The previous values had rotted: of the
# five ids configured here, FOUR were gone (llama-3.3-70b-versatile — the primary! — plus
# qwen3-32b, llama-3.1-8b-instant, and the llama-4-scout vision model), so every fast call was
# 404ing on its first attempt and only recovering on the fallback. Only gpt-oss-120b survived.
# GROQ_VISION_MODEL is deliberately EMPTY: Groq has had no vision-capable model since the
# llama-4 line was retired, and groq.ts fails fast on an unset value rather than guessing a
# dead id. Re-check with `npm run check:ai-models` — this list rots without warning.
GROQ_MODEL = "openai/gpt-oss-120b"
GROQ_FALLBACK_MODELS = "qwen/qwen3.8-27b,qwen/qwen3.6-27b,openai/gpt-oss-20b"
GROQ_VISION_MODEL = ""
# Ollama Cloud — text-only fallback after Groq (free tier: gpt-oss:120b).
OLLAMA_MODEL = "gpt-oss:120b"
# OpenRouter free models (tertiary fallback). The :free roster rotates constantly — as of
# [2026-09-10] all three previously configured ids (openai/gpt-oss-120b:free and
# meta-llama/llama-3.2-11b-vision-instruct:free) were 404, i.e. this whole fallback tier was
# dead in production while looking configured. Values below verified live against
# GET /api/v1/models; vision pick confirmed via architecture.input_modalities.
OPENROUTER_MODEL = "nvidia/nemotron-3-super-120b-a12b:free"
OPENROUTER_TRANSLATE_MODEL = "nvidia/nemotron-3-super-120b-a12b:free"
OPENROUTER_VISION_MODEL = "google/gemma-4-31b-it:free"
